aid: evergreen-marine

name: Evergreen Marine Corp.

description: 'Evergreen Marine Corp. (Taiwan) Ltd. (TWSE: 2603) is a worldwide container shipping company founded by Dr. Yung-Fa Chang in 1968;
  since 2007 its group carriers have operated under the Evergreen Line brand. Through its ShipmentLink e-commerce platform it offers online cargo
  tracking, vessel schedules, booking, e-B/L, VGM submission, EDI services and an API Developer Portal with a catalogue of APIs such as shipment
  Track & Trace, available to customers after an application and registration process.'


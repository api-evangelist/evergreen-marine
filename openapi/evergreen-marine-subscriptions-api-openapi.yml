openapi: 3.2.0
info:
  title: Evergreen Marine Subscriptions API
  version: '2.2'
  description: 'Operations tagged Subscriptions across 2 of this provider''s published API definitions: evergreen-marine-track-and-trace-openapi.json, evergreen-marine-track-and-trace-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Subscriptions
  description: Subscriptions Service Controller
paths:
  /tnt/v2/event-subscriptions:
    get:
      tags:
      - Subscriptions
      summary: Receive a list of your active subscriptions
      operationId: subscriptionsGetUsingGET
      parameters:
      - name: API-Version
        in: header
        description: API-Version
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: A server generated value to specify a specific point in a collection result, used for pagination.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return.
        required: true
        schema:
          type: string
      - name: sort
        in: query
        description: A comma-separated list of field names to define the sort order. Field names should be suffixed by a (:) followed by either the keyword ASC (for ascending order) or DESC (for descening order) to specify direction. <b>:ASC</b> may be omitted, in which case ascending order will be used.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          headers:
            Prev-Page:
              schema:
                type: string
            First-Page:
              schema:
                type: string
            Last-Page:
              schema:
                type: string
            Next-Page:
              schema:
                type: string
            Current-Page:
              schema:
                type: string
            API-Version:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/subscription'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /tnt/v2/event-subscriptions/{subscriptionID}:
    get:
      tags:
      - Subscriptions
      summary: Find a subscription by subscription ID
      operationId: subscriptionsGetIDUsingGET
      parameters:
      - name: API-Version
        in: query
        description: An API-Version header MAY be added to the request (optional); if added it MUST only contain MAJOR version. API-Version header MUST be aligned with the URI version.
        required: true
        schema:
          type: string
      - name: subscriptionID
        in: path
        description: The universal unique ID of the subscription.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          headers:
            Prev-Page:
              schema:
                type: string
            First-Page:
              schema:
                type: string
            Last-Page:
              schema:
                type: string
            Next-Page:
              schema:
                type: string
            Current-Page:
              schema:
                type: string
            API-Version:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/subscription'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    put:
      tags:
      - Subscriptions
      summary: Alter a subscription
      operationId: subscriptionsPutIDUsingPUT
      parameters:
      - name: API-Version
        in: header
        description: API-Version
        required: true
        schema:
          type: string
      - name: subscriptionID
        in: path
        description: The universal unique ID of the subscription.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '201':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subscription'
        description: Parameters used to configure the subscription
        required: true
    delete:
      tags:
      - Subscriptions
      summary: Stop a subscription, using the subscription ID
      operationId: subscriptionsDeleteIDUsingDELETE
      parameters:
      - name: API-Version
        in: header
        description: API-Version
        required: true
        schema:
          type: string
      - name: subscriptionID
        in: path
        description: The universal unique ID of the subscription.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '204':
          description: Subscription stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscription'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  schemas:
    subscription:
      type: object
      properties:
        callbackUrl:
          type: string
          example: https://myserver.com/send/callback/here?shipperRef=<shipper defined unique id>
          description: The endPoint where a Carrier whould send back events to the Shipper. The callback can contain query parameters uniquely identifying the originator of the events.
        carrierBookingReference:
          type: string
          example: ABC709951
          description: A set of unique characters provided by carrier to identify a booking.
        carrierServiceCode:
          type: string
          example: FE1
          description: The code of the service for which the schedule details are published.
        documentTypeCode:
          type: string
        equipmentEventTypeCode:
          type: string
        equipmentReference:
          type: string
          example: APZU4812090
          description: 'The unique identifier for the equipment, which should follow the BIC ISO Container Identification Number where possible.According to ISO 6346, a container identification code consists of a 4-letter prefix and a 7-digit number (composed of a 3-letter owner code, a category identifier, a serial number, and a check-digit).If a container does not comply with ISO 6346,it is suggested to follow Recommendation #2 “Container with non-ISO identification” from SMDG.'
        eventType:
          type: array
          example:
          - TRANSPORT
          - EQUIPMENT
          description: List of eventType to filter by. If multiple values are selected - the OR-operator will be used.<br/><br/><br/><br/>Possible values are<br/><br/><br/><br/> - SHIPMENT (Shipment events)<br/><br/> - TRANSPORT (Transport events)<br/><br/> - EQUIPMENT (Equipment events)<br/><br/><br/><br/>Default is none as it will not filter on eventType if not specified.
          items:
            type: string
        exportVoyageNumber:
          type: string
          example: 2103S
          description: The vessel operator-specific identifier of the export Voyage.
        secret:
          type: string
          example: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDM2NTc4NjIzODk3NDY5MDgyNzM0OTg3MTIzNzg2NA==
          description: A shared secret shared between the Publisher and the Subscriber. It is used to compute the contents of the Notification-Signature header.Only valid in POST calls - anywhere else must be omitted
        shipmentEventTypeCode:
          type: string
        transportCallID:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier for a transport call
        transportDocumentReference:
          type: string
          description: A unique number allocated by the shipping line to the transport document and the main number used for the tracking of the status of the shipment.
        transportEventTypeCode:
          type: string
        unlocationCode:
          type: string
        vesselIMONumber:
          type: string
          example: 9321483
          description: The unique reference for a registered Vessel. The reference is the International Maritime Organisation (IMO) number, also sometimes known as the Lloyd's register code, which does not change during the lifetime of the vessel
      title: subscription
x-refined-from:
- evergreen-marine-track-and-trace-openapi.json
- evergreen-marine-track-and-trace-openapi.yml

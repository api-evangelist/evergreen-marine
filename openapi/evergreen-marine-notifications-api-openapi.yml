          $ref: '#/components/schemas/ExportLicense'
        importLicense:
          $ref: '#/components/schemas/ImportLicense'
        outerPackaging:
          $ref: '#/components/schemas/OuterPackaging'
        references:
          type: array
          description: 'A list of `References`

            '
          items:
            $ref: '#/components/schemas/Reference'
        customsReferences:
          type: array
          description: 'A list of `Customs references`

            '
          items:
            $ref: '#/components/schemas/CustomsReference'
      description: 'Type of goods, defined by its commodity type

        '
    DocumentParties:
      title: Document Parties
      type: object
      properties:
        bookingAgent:
          $ref: '#/components/schemas/BookingAgent'
        shipper:
          $ref: '#/components/schemas/Shipper'
        consignee:
          $ref: '#/components/schemas/Consignee'
        serviceContractOwner:
          $ref: '#/components/schemas/ServiceContractOwner'
        carrierBookingOffice:
          $ref: '#/components/schemas/CarrierBookingOffice'
        other:
          type: array
          description: A list of document parties that can be optionally provided at booking stage.
          items:
            $ref: '#/components/schemas/OtherDocumentParty'
      description: 'All `Parties` with associated roles.

        '
    CarrierBookingOffice:
      title: Carrier Booking Office
      required:
      - UNLocationCode
      - partyName
      type: object
      properties:
        partyName:
          maxLength: 70
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'Name of the party.

            '
          example: IKEA Denmark
        UNLocationCode:
          maxLength: 5
          minLength: 5
          pattern: ^[A-Z]{2}[A-Z2-9]{3}$
          type: string
          description: 'The UN Location code specifying where the carrier booking office is located. The pattern used must be


            - 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

            - 3 characters to code a location within that country. Letters A-Z and numbers from 2-9 can be used


            More info can be found here: [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)

            '
          example: NLAMS
        address:
          $ref: '#/components/schemas/Address'
        partyContactDetails:
          minItems: 1
          type: array
          description: 'A list of contact details

            '
          items:
            $ref: '#/components/schemas/PartyContactDetail'
      description: 'The carrier office responsible for processing the booking.

        '
    EmptyContainerDepotReleaseLocation:
      title: Empty Container Depot Release Location
      type: object
      properties:
        locationName:
          maxLength: 100
          pattern: ^\S(?:.*\S)?$
          type: string
          description: The name of the location.
          example: Shanghai Shengdong International Container Terminal
        address:
          $ref: '#/components/schemas/Address'
        facility:
          $ref: '#/components/schemas/Facility'
        UNLocationCode:
          maxLength: 5
          minLength: 5
          pattern: ^[A-Z]{2}[A-Z2-9]{3}$
          type: string
          description: 'The UN Location code specifying where the place is located. The pattern used must be


            - 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

            - 3 characters to code a location within that country. Letters A-Z and numbers from 2-9 can be used


            More info can be found here: [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)

            '
          example: NLAMS
        geoCoordinate:
          $ref: '#/components/schemas/GeoCoordinate'
      description: 'An object to capture the `Empty Container Depot Release Location`.


        The location of the depot from which the empty container(s) will be released from


        The location can be specified in **any** of the following ways: `Address`, `Facility`, `UN Location Code` or a `GeoCoordinate`.


        **Condition:** It is expected that if a location is specified in multiple ways (e.g. both as an `Address` and as a `Facility`) that both ways point to the same location.

        '
      example:
        locationName: Shanghai Shengdong International Container Terminal
        UNLocationCode: CNSGH
        facility:
          facilityCode: SHENG
          facilityCodeListProvider: SMDG
    DangerousGoods:
      title: Dangerous Goods
      required:
      - emergencyContactDetails
      - grossWeight
      - imoClass
      - isCompetentAuthorityApprovalRequired
      - isEmptyUncleanedResidue
      - isExceptedQuantity
      - isHot
      - isLimitedQuantity
      - isMarinePollutant
      - isReportableQuantity
      - isSalvagePackings
      - isWaste
      - properShippingName
      type: object
      properties:
        codedVariantList:
          maxLength: 4
          minLength: 4
          pattern: ^[0-3][0-9A-Z]{3}$
          type: string
          description: 'Four-character code supplied by Exis Technologies that assists to remove ambiguities when identifying a variant within a single `UN number` or `NA number` that may occur when two companies exchange DG information.


            Character | Valid Characters | Description

            :--------:|------------------|------------

            1| 0, 1, 2, 3|The packing group. Code 0 indicates there is no packing group

            2|0 to 9 and A to Z|A sequence letter for the PSN, or 0 if there were no alternative PSNs

            3 and 4|0 to 9 and A to Z|Two sequence letters for other information, for the cases where the variant is required because of different in subrisks, packing instruction etc.

            '
          example: '2200'
        properShippingName:
          maxLength: 250
          type: string
          description: 'The proper shipping name for goods under IMDG Code, or the product name for goods under IBC Code and IGC Code, or the bulk cargo shipping name for goods under IMSBC Code, or the name of oil for goods under Annex I to the MARPOL Convention.

            '
          example: Chromium Trioxide, anhydrous
        technicalName:
          maxLength: 250
          type: string
          description: 'The recognized chemical or biological name or other name currently used for the referenced dangerous goods as described in chapter 3.1.2.8 of the IMDG Code.

            '
          example: xylene and benzene
        imoClass:
          maxLength: 4
          type: string
          description: 'The hazard class code of the referenced dangerous goods according to the specified regulation. Examples of possible values are:

            - `1.1A` (Substances and articles which have a mass explosion hazard)

            - `1.6N` (Extremely insensitive articles which do not have a mass explosion hazard)

            - `2.1` (Flammable gases)

            - `8` (Corrosive substances)

            '
          example: 1.4S
        subsidiaryRisk1:
          maxLength: 3
          minLength: 1
          pattern: ^[0-9](\.[0-9])?$
          type: string
          description: 'Any risk in addition to the class of the referenced dangerous goods according to the IMO IMDG Code.

            '
          example: '1.2'
        subsidiaryRisk2:
          maxLength: 3
          minLength: 1
          pattern: ^[0-9](\.[0-9])?$
          type: string
          description: 'Any risk in addition to the class of the referenced dangerous goods according to the IMO IMDG Code.

            '
          example: '1.2'
        isMarinePollutant:
          type: boolean
          description: 'Indicates if the goods belong to the classification of Marine Pollutant.

            '
          example: false
        packingGroup:
          maximum: 3
          minimum: 1
          type: integer
          description: 'The packing group according to the UN Recommendations on the Transport of Dangerous Goods and IMO IMDG Code.

            '
          format: int32
          example: 3
        isLimitedQuantity:
          type: boolean
          description: 'Indicates if the dangerous goods can be transported as limited quantity in accordance with Chapter 3.4 of the IMO IMDG Code.

            '
          example: false
        isExceptedQuantity:
          type: boolean
          description: 'Indicates if the dangerous goods can be transported as excepted quantity in accordance with Chapter 3.5 of the IMO IMDG Code.

            '
          example: false
        isSalvagePackings:
          type: boolean
          description: 'Indicates if the cargo has special packaging for the transport, recovery or disposal of damaged, defective, leaking or nonconforming hazardous materials packages, or hazardous materials that have spilled or leaked.

            '
          example: false
        isEmptyUncleanedResidue:
          type: boolean
          description: 'Indicates if the cargo is residue.

            '
          example: false
        isWaste:
          type: boolean
          description: 'Indicates if waste is being shipped

            '
          example: false
        isHot:
          type: boolean
          description: 'Indicates if high temperature cargo is shipped.

            '
          example: false
        isCompetentAuthorityApprovalRequired:
          type: boolean
          description: 'Indicates if the cargo require approval from authorities

            '
          example: false
        competentAuthorityApproval:
          maxLength: 70
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'Name and reference number of the competent authority providing the approval.

            '
          example: '{Name and reference...}'
        segregationGroups:
          type: array
          description: 'List of the segregation groups applicable to specific hazardous goods according to the IMO IMDG Code.


            **Condition:** only applicable to specific hazardous goods.

            '
          items:
            maxLength: 2
            type: string
            description: 'Grouping of Dangerous Goods having certain similar chemical properties. Possible values are:

              - `1` (Acids)

              - `2` (Ammonium Compounds)

              - `3` (Bromates)

              - `4` (Chlorates)

              - `5` (Chlorites)

              - `6` (Cyanides)

              - `7` (Heavy metals and their salts)

              - `8` (Hypochlorites)

              - `9` (Lead and its compounds)

              - `10` (Liquid halogenated hydrocarbons)

              - `11` (Mercury and mercury compounds)

              - `12` (Nitrites and their mixtures)

              - `13` (Perchlorates)

              - `14` (Permanganates)

              - `15` (Powdered metals)

              - `16` (Peroxides),

              - `17` (Azides)

              - `18` (Alkalis)

              '
            example: '12'
        innerPackagings:
          type: array
          description: 'A list of `Inner Packings` contained inside this `outer packaging/overpack`.

            '
          items:
            $ref: '#/components/schemas/InnerPackaging'
        emergencyContactDetails:
          $ref: '#/components/schemas/EmergencyContactDetails'
        EMSNumber:
          maxLength: 7
          type: string
          description: 'The emergency schedule identified in the IMO EmS Guide - Emergency Response Procedures for Ships Carrying Dangerous Goods. Comprises 2 values; 1 for spillage and 1 for fire. Possible values spillage: S-A to S-Z. Possible values fire: F-A to F-Z.

            '
          example: F-A S-Q
        endOfHoldingTime:
          type: string
          description: 'Date by when the refrigerated liquid needs to be delivered.

            '
          format: date
          example: '2021-09-03T00:00:00.000Z'
        fumigationDateTime:
          type: string
          description: 'Date & time when the container was fumigated

            '
          format: date-time
          example: '2024-09-04T09:41:00.000Z'
        isReportableQuantity:
          type: boolean
          description: 'Indicates if a container of hazardous material is at the reportable quantity level. If `TRUE`, a report to the relevant authority must be made in case of spill.

            '
          example: false
        inhalationZone:
          maxLength: 1
          minLength: 1
          type: string
          description: 'The zone classification of the toxicity of the inhalant. Possible values are:

            - `A` (Hazard Zone A) can be assigned to specific gases and liquids

            - `B` (Hazard Zone B) can be assigned to specific gases and liquids

            - `C` (Hazard Zone C) can **only** be assigned to specific gases

            - `D` (Hazard Zone D) can **only** be assigned to specific gases

            '
          example: A
        grossWeight:
          $ref: '#/components/schemas/GrossWeight'
        netWeight:
          $ref: '#/components/schemas/NetWeight'
        netExplosiveContent:
          $ref: '#/components/schemas/NetExplosiveContent'
        netVolume:
          $ref: '#/components/schemas/NetVolume'
        limits:
          $ref: '#/components/schemas/Limits'
        specialCertificateNumber:
          maxLength: 255
          type: string
          description: 'Text field to indicate certificate number & segment for specific stowage requirements overruling IMDG code

            '
          example: '22663:3'
        additionalContainerCargoHandling:
          maxLength: 255
          type: string
          description: 'Text field to provide cargo handling information already known at the booking stage.

            '
          example: To be handled with extreme care
      description: 'Specification for `Dangerous Goods`. It is mandatory to provide one of `UNNumber` or `NANumber`. Dangerous Goods is based on **IMDG Amendment Version 41-22**.

        '
      oneOf:
      - title: UN Number
        required:
        - UNNumber
        type: object
        properties:
          UNNumber:
            maxLength: 4
            minLength: 4
            pattern: ^\d{4}$
            type: string
            description: 'United Nations Dangerous Goods Identifier (UNDG) assigned by the UN Sub-Committee of Experts on the Transport of Dangerous Goods and shown in the IMO IMDG.

              '
            example: '1463'
      - title: NA Number
        required:
        - NANumber
        type: object
        properties:
          NANumber:
            maxLength: 4
            minLength: 4
            pattern: ^\d{4}$
            type: string
            description: 'Four-digit number that is assigned to dangerous, hazardous, and harmful substances by the United States Department of Transportation.

              '
            example: '9037'
    TareWeight:
      title: Tare Weight
      required:
      - unit
      - value
      type: object
      properties:
        value:
          type: number
          description: 'The weight of an empty container (gross container weight).

            '
          format: float
          example: 4000
          exclusiveMinimum: 0
        unit:
          type: string
          description: 'The unit of measure which can be expressed in imperial or metric terms

            - `KGM` (Kilograms)

            - `LBR` (Pounds)

            '
          example: KGM
          enum:
          - KGM
          - LBR
      description: 'The weight of an empty container (gross container weight).


        **Condition:** In case of Shipper Owned Containers (`SOC`) this is a required property

        '
    RequestedEquipment:
      title: Requested Equipment
      required:
      - ISOEquipmentCode
      - isShipperOwned
      - units
      type: object
      properties:
        ISOEquipmentCode:
          maxLength: 4
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'Unique code for the different equipment size and type used to transport commodities. The code can refer to one of ISO size type (e.g. 22G1) or ISO type group (e.g. 22GP) following the [ISO 6346](https://www.iso.org/standard/83558.html) standard.

            '
          example: 22RT
        units:
          minimum: 1
          type: integer
          description: 'Number of requested equipment units.

            '
          format: int32
          example: 3
        containerPositionings:
          type: array
          description: "A list of date and time and locations of the customer facility where the container(s) will be loaded. If multiple Container positioning locations (`CPO`) are provided (multi-stop), the first location is where the empty container will be stuffed first. The order in which the `CPO` locations should be visited is implicitly defined by the shipper based on the date and time provided per location.\n\n**Condition:** Only applicable to carrier haulage service at origin (`Receipt type at origin = 'SD'`). \n"
          items:
            $ref: '#/components/schemas/ContainerPositioning'
        emptyContainerPickup:
          $ref: '#/components/schemas/EmptyContainerPickup'
        equipmentReferences:
          type: array
          description: 'A list of equipments to be used by the shipper if known at the time of booking

            '
          items:
            maxLength: 11
            pattern: ^\S(?:.*\S)?$
            type: string
            description: 'The unique identifier for the equipment, which should follow the BIC ISO Container Identification Number where possible.


              According to [ISO 6346](https://www.iso.org/standard/83558.html), a container identification code consists of a 4-letter prefix and a 7-digit number (composed of a 3-letter owner code, a category identifier, a serial number, and a check-digit).


              If a container does not comply with [ISO 6346](https://www.iso.org/standard/83558.html), it is suggested to follow [Recommendation #2: Containers with non-ISO identification](https://smdg.org/documents/smdg-recommendations) from SMDG.

              '
            example: APZU4812090
        tareWeight:
          $ref: '#/components/schemas/TareWeight'
        cargoGrossWeight:
          $ref: '#/components/schemas/CargoGrossWeightReq'
        isShipperOwned:
          type: boolean
          description: 'Indicates whether the container is shipper owned (`SOC`).

            '
          example: true
        isNonOperatingReefer:
          type: boolean
          description: 'If the equipment is a Reefer Container then setting this attribute will indicate that the container should be treated as a `DRY` container.


            **Condition:** Only applicable if `ISOEquipmentCode` shows a Reefer type.

            '
          example: false
        activeReeferSettings:
          $ref: '#/components/schemas/ActiveReeferSettings'
        references:
          type: array
          description: 'A list of `References`

            '
          items:
            $ref: '#/components/schemas/Reference'
        customsReferences:
          type: array
          description: 'A list of `Customs references`

            '
          items:
            $ref: '#/components/schemas/CustomsReference'
        commodities:
          type: array
          description: 'A list of `Commodities`

            '
          items:
            $ref: '#/components/schemas/Commodity'
      description: 'If needed - it is **only** possible to specify a single Reefer setting. If multiple settings are required for the same `equipmentSizeType` then multiple `requestedEquipment` should be specified (one for each Reefer setting).

        '
    ActiveReeferSettings:
      title: Active Reefer Settings
      required:
      - temperatureSetpoint
      - temperatureUnit
      type: object
      properties:
        temperatureSetpoint:
          type: number
          description: 'Target value of the temperature for the Reefer based on the cargo requirement.

            '
          format: float
          example: -15
        temperatureUnit:
          type: string
          description: 'The unit for temperature in Celsius or Fahrenheit

            - `CEL` (Celsius)

            - `FAH` (Fahrenheit)


            **Condition:** Mandatory to provide if `temperatureSetpoint` is provided

            '
          example: CEL
          enum:
          - CEL
          - FAH
        o2Setpoint:
          maximum: 100
          minimum: 0
          type: number
          description: 'The percentage of the controlled atmosphere CO<sub>2</sub> target value

            '
          format: float
          example: 25
        co2Setpoint:
          maximum: 100
          minimum: 0
          type: number
          description: 'The percentage of the controlled atmosphere CO<sub>2</sub> target value

            '
          format: float
          example: 25
        humiditySetpoint:
          maximum: 100
          minimum: 0
          type: number
          description: 'The percentage of the controlled atmosphere humidity target value

            '
          format: float
          example: 95.6
        airExchangeSetpoint:
          minimum: 0
          type: number
          description: 'Target value for the air exchange rate which is the rate at which outdoor air replaces indoor air within a Reefer container

            '
          format: float
          example: 15.4
        airExchangeUnit:
          type: string
          description: 'The unit for `airExchange` in metrics- or imperial- units per hour

            - `MQH` (Cubic metre per hour)

            - `FQH` (Cubic foot per hour)


            **Condition:** Mandatory to provide if `airExchange` is provided

            '
          example: MQH
          enum:
          - MQH
          - FQH
        isVentilationOpen:
          type: boolean
          description: 'If `true` the ventilation orifice is `Open` - if `false` the ventilation orifice is `closed`

            '
          example: true
        isDrainholesOpen:
          type: boolean
          description: 'Is drain holes open on the container

            '
          example: true
        isBulbMode:
          type: boolean
          description: 'Is special container setting for handling flower bulbs active

            '
          example: true
        isColdTreatmentRequired:
          type: boolean
          description: 'Indicator whether cargo requires cold treatment prior to loading at origin or during transit, but prior arrival at POD

            '
          example: true
        isControlledAtmosphereRequired:
          type: boolean
          description: 'Indicator of whether cargo requires Controlled Atmosphere.

            '
          example: true
        isPreCoolingRequired:
          type: boolean
          description: 'Indicator whether reefer container should be pre-cooled to the temperature setting required at time of release from depot

            '
          example: true
        isGeneratorSetRequired:
          type: boolean
          description: 'Indicator whether reefer container should have a generator set attached at time of release from depot

            '
          example: true
      description: 'The specifications for a Reefer equipment.


        **Condition:** Only applicable when `isNonOperatingReefer` is set to `false`

        '
    Party:
      title: Party
      required:
      - partyName
      type: object
      properties:
        partyName:
          maxLength: 70
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'Name of the party.

            '
          example: IKEA Denmark
        address:
          $ref: '#/components/schemas/PartyAddress'
        identifyingCodes:
          type: array
          items:
            $ref: '#/components/schemas/IdentifyingCode'
        taxLegalReferences:
          type: array
          description: 'A list of `Tax References` for a `Party`

            '
          items:
            $ref: '#/components/schemas/TaxLegalReference'
        partyContactDetails:
          minItems: 1
          type: array
          description: 'A list of contact details

            '
          items:
            $ref: '#/components/schemas/PartyContactDetail'
        reference:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'A reference linked to the `Party`.

            '
          example: HHL007
      description: 'Refers to a company or a legal entity.

        '
    PartyContactDetail:
      title: Party Contact Detail
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'Name of the contact

            '
          example: Henrik
      description: 'The contact details of the person to contact. It is mandatory to provide either `phone` and/or `email` along with the `name`, both can be provided.

        '
      example:
        name: Henrik
        phone: +45 51801234
      anyOf:
      - title: Phone required
        required:
        - phone
        type: object
        properties:
          phone:
            maxLength: 30
            pattern: ^\S(?:.*\S)?$
            type: string
            description: 'Phone number for the contact. Phone **MUST** include an international phone number format as defined in the [ITU-T recommendation E.123](https://www.itu.int/rec/T-REC-E.123/en).

              '
            example: +45 70262970
        description: '`Phone` is mandatory to provide

          '
      - title: Email required
        required:
        - email
        type: object
        properties:
          email:
            maxLength: 100
            pattern: ^.+@\S+$
            type: string
            description: '`E-mail` address to be used

              '
            example: info@dcsa.org
        description: '`Email` is mandatory to provide

          '
    Address:
      title: Address
      required:
      - city
      - countryCode
      - street
      type: object
      properties:
        street:
          maxLength: 70
          type: string
          description: The name of the street.
          example: Ruijggoordweg
        streetNumber:
          maxLength: 50
          type: string
          description: The number of the street.
          example: '100'
        floor:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The floor of the street number.

            '
          example: 2nd
        postCode:
          maxLength: 10
          type: string
          description: The post code.
          example: 1047 HM
        POBox:
          maxLength: 20
          type: string
          description: A numbered box at a post office where a person or business can have mail or parcels delivered.
          example: '123'
        city:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The name of the city.

            '
          example: Amsterdam
        stateRegion:
          maxLength: 65
          type: string
          description: The name of the state/region.
          example: North Holland
        countryCode:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
          type: string
          description: 'The 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

            '
          example: NL
      description: 'An object for storing address related information

        '
    PlaceOfBLIssue:
      title: Place of B/L Issue
      type: object
      properties:
        locationName:
          maxLength: 100
          pattern: ^\S(?:.*\S)?$
          type: string
          description: The name of the location.
          example: Port of Amsterdam
      description: 'An object to capture where the original Transport Document (`Bill of Lading`) will be issued.


        The location can be specified as one of `UN Location Code` or `CountryCode`, but not both.

        '
      oneOf:
      - title: UN Location Code
        required:
        - UNLocationCode
        type: object
        properties:
          UNLocationCode:
            maxLength: 5
            minLength: 5
            pattern: ^[A-Z]{2}[A-Z2-9]{3}$
            type: string
            description: 'The UN Location code specifying where the place is located. The pattern used must be


              - 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

              - 3 characters to code a location within that country. Letters A-Z and numbers from 2-9 can be used


              More info can be found here: [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)

              '
            example: NLAMS
      - title: Country Code
        required:
        - countryCode
        type: object
        properties:
          countryCode:
            maxLength: 2
            minLength: 2
            pattern: ^[A-Z]{2}$
            type: string
            description: 'The 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

              '
            example: DK
    ShipmentLocation:
      title: Shipment Location
      required:
      - location
      - locationTypeCode
      type: object
      properties:
        location:
          $ref: '#/components/schemas/Location'
        locationTypeCode:
          maxLength: 3
          type: string
          description: 'Links to the Location Type Code defined by DCSA. Possible values are:

            - `PRE` (Place of Receipt)

            - `POL` (Port of Loading)

            - `POD` (Port of Discharge)

            - `PDE` (Place of Delivery)

            - `PCF` (Pre-carriage From)

            - `OIR` (Onward In-land Routing)


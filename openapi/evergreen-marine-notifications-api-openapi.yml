      responses:
        '204':
          description: 'No Content

            '
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
        '400':
          description: 'In case the `Notification` does not schema validate a `400` (Bad Request) is returned

            '
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badRequestExample:
                  summary: 'Booking missing carrierBookingReference or carrierBookingRequestReference

                    '
                  description: '`carrierBookingReference` or `carrierBookingRequestReference` is a conditionally property in the `Notification` (at least one of them must be present). This is an example of how the error object would look in case this property is missing


                    **NB**: `errorCode` not yet standardized by DCSA. Value `7003` is just a "random example"

                    '
                  value:
                    httpMethod: POST
                    requestUri: /booking-notifications
                    statusCode: 400
                    statusCodeText: Bad Request
                    statusCodeMessage: 'carrierBookingReference or carrierBookingRequestReference not found - one of them is a mandatory to provide in a Notification

                      '
                    providerCorrelationReference: 4426d965-0dd8-4005-8c63-dc68b01c4962
                    errorDateTime: '2024-09-04T09:41:00.000Z'
                    errors:
                    - errorCode: 7003
                      property: carrierBookingReference or carrierBookingRequestReference
                      errorCodeText: mandatory property missing
                      errorCodeMessage: 'carrierBookingReference or carrierBookingRequestReference must be provided as part of a Notification

                        '
        '500':
          description: 'In case a server error occurs in provider system a `500` (Internal Server Error) is returned

            '
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalServerErrorExample:
                  summary: 'Internal Server Error while processing Notification

                    '
                  description: 'An Internal Server Error has occurred - the consumer should contact {provider-support} and provide the `providerCorrelationReference` (in the example this is `4426d965-0dd8-4005-8c63-dc68b01c4962`)


                    **NB**: `errorCode` not yet standardized by DCSA. Value `7003` is just a "random example"

                    '
                  value:
                    httpMethod: POST
                    requestUri: /booking-notifications
                    statusCode: 500
                    statusCodeText: Internal Server Error
                    statusCodeMessage: 'Internal Server Error occurred while processing Booking request

                      '
                    providerCorrelationReference: 4426d965-0dd8-4005-8c63-dc68b01c4962
                    errorDateTime: '2024-09-04T09:41:00.000Z'
                    errors:
                    - errorCode: 7003
                      errorCodeText: Internal Error occurred
                      errorCodeMessage: Internal Error occurred
        default:
          description: 'For other errors the error object should be populated with relevant information

            '
          headers:
            API-Version:
              $ref: '#/components/headers/API-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tooManyRequestsExample:
                  summary: 'Making too many Notifications

                    '
                  description: "Calling the endPoint\n\n    POST /booking-notifications\n\ntoo many times within a time period.\n\n**NB**: `errorCode` not yet standardized by DCSA. Value `7003` is just a \"random example\"\n"
                  value:
                    httpMethod: POST
                    requestUri: /booking-notifications
                    statusCode: 429
                    statusCodeText: Too Many Requests
                    statusCodeMessage: 'Too many request to create a Notification has been requested. Please try again in 1 hour

                      '
                    providerCorrelationReference: 4426d965-0dd8-4005-8c63-dc68b01c4962
                    errorDateTime: '2024-09-04T09:41:00.000Z'
                    errors:
                    - errorCode: 7003
                      errorCodeText: Max Notifications reached
                      errorCodeMessage: A maximum of 10 Notifications can be created per hour
components:
  schemas:
    DestinationChargesPaymentTerm:
      title: Destination Charges Payment Term
      type: object
      properties:
        haulageChargesPaymentTermCode:
          type: string
          description: 'An indicator of whether the costs for inland transportation to the port, when applicable, are prepaid (`PRE`) or collect (`COL`).


            - `PRE` (Prepaid)

            - `COL` (Collect)

            '
          example: PRE
          enum:
          - PRE
          - COL
        portChargesPaymentTermCode:
          type: string
          description: 'An indicator of whether the destination port charges are prepaid (`PRE`) or collect (`COL`).


            - `PRE` (Prepaid)

            - `COL` (Collect)

            '
          example: PRE
          enum:
          - PRE
          - COL
        otherChargesPaymentTermCode:
          type: string
          description: 'An indicator of whether destination charges (excluding port and haulage) are prepaid (`PRE`) or collect (`COL`).


            - `PRE` (Prepaid)

            - `COL` (Collect)

            '
          example: PRE
          enum:
          - PRE
          - COL
      description: 'An indicator of whether destination charges are prepaid (`PRE`) or collect (`COL`). When prepaid, the charges are the responsibility of the shipper or the Invoice payer on behalf of the shipper (if provided). When collect, the charges are the responsibility of the consignee or the Invoice payer on behalf of the consignee (if provided).

        '
    ErrorResponse:
      title: Error Response
      required:
      - errorDateTime
      - errors
      - httpMethod
      - requestUri
      - statusCode
      - statusCodeText
      type: object
      properties:
        httpMethod:
          type: string
          description: 'The HTTP method used to make the request e.g. `GET`, `POST`, etc

            '
          example: POST
          enum:
          - GET
          - HEAD
          - POST
          - PUT
          - DELETE
          - OPTION
          - PATCH
        requestUri:
          type: string
          description: 'The URI that was requested.

            '
          example: /v1/events
        statusCode:
          type: integer
          description: 'The HTTP status code returned.

            '
          format: int32
          example: 400
        statusCodeText:
          maxLength: 50
          type: string
          description: 'A standard short description corresponding to the HTTP status code.

            '
          example: Bad Request
        statusCodeMessage:
          maxLength: 200
          type: string
          description: 'A long description corresponding to the HTTP status code with additional information.

            '
          example: The supplied data could not be accepted
        providerCorrelationReference:
          maxLength: 100
          type: string
          description: 'A unique identifier to the HTTP request within the scope of the API provider.

            '
          example: 4426d965-0dd8-4005-8c63-dc68b01c4962
        errorDateTime:
          type: string
          description: 'The DateTime corresponding to the error occurring. Must be formatted using [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.

            '
          format: date-time
          example: '2024-09-04T09:41:00.000Z'
        errors:
          minItems: 1
          type: array
          description: 'An array of errors providing more detail about the root cause.

            '
          items:
            $ref: '#/components/schemas/DetailedError'
      description: Unexpected error
    AmendedBookingFullNotification:
      title: Amended Booking
      type: object
      description: "This property contains the amended booking in case:\n  - an amendment is currently active\n  - the subscriber is subscribing to the `Full State Transfer` of the Booking\n\nIn case the subscriber does not subscribe to the `Full State Transfer` of the Booking or no amendment is active - then the content in this property can be ignored.\n"
      allOf:
      - $ref: '#/components/schemas/Booking'
    DischargeLocation:
      title: Discharge Location
      type: object
      properties:
        locationName:
          maxLength: 100
          pattern: ^\S(?:.*\S)?$
          type: string
          description: The name of the location.
          example: Port of Amsterdam
        address:
          $ref: '#/components/schemas/Address'
        facility:
          $ref: '#/components/schemas/Facility'
        UNLocationCode:
          maxLength: 5
          minLength: 5
          pattern: ^[A-Z]{2}[A-Z2-9]{3}$
          type: string
          description: 'The UN Location code specifying where the place is located. The pattern used must be


            - 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

            - 3 characters to code a location within that country. Letters A-Z and numbers from 2-9 can be used


            More info can be found here: [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)

            '
          example: NLAMS
      description: 'An object to capture the `Discharge Location`.


        The location can be specified in **any** of the following ways: `UN Location Code`, `Facility` or an `Address`.


        **Condition:** It is expected that if a location is specified in multiple ways (e.g. both as an `Address` and as a `Facility`) that both ways point to the same location.

        '
      example:
        locationName: Transnet Port Terminals Cape Town
        UNLocationCode: ZACPT
        facility:
          facilityCode: TNCT
          facilityCodeListProvider: SMDG
    ContainerPositioningLocation:
      title: Container Positioning Location
      type: object
      properties:
        locationName:
          maxLength: 100
          pattern: ^\S(?:.*\S)?$
          type: string
          description: The name of the location.
          example: Shanghai Shengdong International Container Terminal
        address:
          $ref: '#/components/schemas/Address'
        facility:
          $ref: '#/components/schemas/Facility'
        UNLocationCode:
          maxLength: 5
          minLength: 5
          pattern: ^[A-Z]{2}[A-Z2-9]{3}$
          type: string
          description: 'The UN Location code specifying where the place is located. The pattern used must be


            - 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

            - 3 characters to code a location within that country. Letters A-Z and numbers from 2-9 can be used


            More info can be found here: [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)

            '
          example: NLAMS
        geoCoordinate:
          $ref: '#/components/schemas/GeoCoordinate'
      description: 'An object to capture the `Container Positioning Location`.


        The location of the customer facility where the container(s) will be loaded.


        **Condition:** Only applicable to carrier haulage service at origin (`Receipt type at origin = ''SD''`).


        The location can be specified in **any** of the following ways: `Address`, `Facility`, `UN Location Code` or a `GeoCoordinate`.


        **Condition:** It is expected that if a location is specified in multiple ways (e.g. both as an `Address` and as a `Facility`) that both ways point to the same location.

        '
      example:
        locationName: Shanghai Shengdong International Container Terminal
        UNLocationCode: CNSGH
        facility:
          facilityCode: SHENG
          facilityCodeListProvider: SMDG
    IdentifyingCode:
      title: Identifying Code
      required:
      - codeListProvider
      - partyCode
      type: object
      properties:
        codeListProvider:
          maxLength: 100
          type: string
          description: 'A list of codes identifying a party. Possible values are:

            - `WAVE` (Wave)

            - `CARX` (CargoX)

            - `ESSD` (EssDOCS)

            - `IDT` (ICE Digital Trade)

            - `BOLE` (Bolero)

            - `EDOX` (EdoxOnline)

            - `IQAX` (IQAX)

            - `SECR` (Secro)

            - `TRGO` (TradeGO)

            - `ETEU` (eTEU)

            - `TRAC` (Enigio trace:original)

            - `BRIT` (BRITC eBL)

            - `GSBN` (Global Shipping Business Network)

            - `WISE` (WiseTech)

            - `GLEIF` (Global Legal Entity Identifier Foundation)

            - `W3C` (World Wide Web Consortium)

            - `DNB` (Dun and Bradstreet)

            - `FMC` (Federal Maritime Commission)

            - `DCSA` (Digital Container Shipping Association)

            - `ZZZ` (Mutually defined)

            '
          example: W3C
        partyCode:
          maxLength: 150
          type: string
          description: 'Code to identify the party as provided by the code list provider

            '
          example: MSK
        codeListName:
          maxLength: 100
          type: string
          description: 'The name of the code list, code generation mechanism or code authority for the `partyCode`. Example values could be:

            - `DID` (Decentralized Identifier) for `codeListProvider` `W3C`

            - `LEI` (Legal Entity Identifier) for `codeListProvider` `GLEIF`

            - `DUNS` (Data Universal Numbering System) for `codeListProvider` `DNB`

            '
          example: DID
    NetExplosiveContent:
      title: Net Explosive Content
      required:
      - unit
      - value
      type: object
      properties:
        value:
          type: number
          description: 'The total weight of the explosive substances, without the packaging��s, casings, etc.

            '
          format: float
          example: 2.4
          exclusiveMinimum: 0
        unit:
          type: string
          description: 'Unit of measure used to describe the `netExplosiveWeight`. Possible values are:

            - `KGM` (Kilograms)

            - `LBR` (Pounds)

            - `GRM` (Grams)

            - `ONZ` (Ounce)

            '
          example: KGM
          enum:
          - KGM
          - LBR
          - GRM
          - ONZ
      description: 'The total weight of the explosive substances, without the packaging��s, casings, etc.

        '
    Facility:
      title: Facility
      required:
      - facilityCode
      - facilityCodeListProvider
      type: object
      properties:
        facilityCode:
          maxLength: 6
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The code used for identifying the specific facility. This code does not include the UN Location Code.


            The definition of the code depends on the `facilityCodeListProvider`. As code list providers maintain multiple codeLists the following codeList is used:


            - `SMDG` (the codeList used is the [SMDG Terminal Code List](https://smdg.org/documents/smdg-code-lists/))

            - `BIC` (the codeList used is the [BIC Facility Codes](https://www.bic-code.org/facility-codes/))

            '
          example: ADT
        facilityCodeListProvider:
          type: string
          description: 'The provider used for identifying the facility Code. Some facility codes are only defined in combination with an `UN Location Code`

            - `BIC` (Requires a UN Location Code)

            - `SMDG` (Requires a UN Location Code)

            '
          example: SMDG
          enum:
          - BIC
          - SMDG
      description: 'An object used to express a location using a `Facility`. The facility can be expressed using one of `BIC` code or `SMDG` code. The `facilityCode` does not contain the `UNLocationCode` - this should be provided in the `UnLocationCode` attribute.

        '
    Booking:
      title: Booking
      required:
      - bookingStatus
      - cargoMovementTypeAtDestination
      - cargoMovementTypeAtOrigin
      - deliveryTypeAtDestination
      - documentParties
      - isEquipmentSubstitutionAllowed
      - receiptTypeAtOrigin
      - requestedEquipments
      - shipmentLocations
      type: object
      properties:
        carrierBookingRequestReference:
          maxLength: 100
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'A reference to the booking during the booking request phase.


            **Condition:** `carrierBookingRequestReference` and/or `carrierBookingReference` must be provided

            '
          example: 24595eb0-5cfc-4381-9c3a-cedc1975e9aa
        carrierBookingReference:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The `carrierBookingReference` if know. Often this will not be known until the booking has been confirmed. Is available during a booking amendment.


            **Condition:** `carrierBookingRequestReference` and/or `carrierBookingReference` must be provided

            '
          example: ABC709951
        bookingStatus:
          maxLength: 50
          type: string
          description: 'The status of the `Booking`. Possible values are:

            - `RECEIVED` (Booking request has been received)

            - `PENDING_UPDATE` (An update is required to the Booking)

            - `UPDATE_RECEIVED` (An update has been received and is awaiting to be processed)

            - `CONFIRMED` (Booking has been Confirmed)

            - `PENDING_AMENDMENT` (An amendment is required to the Booking)

            - `REJECTED` (Booking discontinued by carrier before it has been Confirmed)

            - `DECLINED` (Booking discontinued by carrier after it has been Confirmed)

            - `CANCELLED` (Booking discontinued by consumer)

            - `COMPLETED` (The Transport Document this Booking is connected to has been Surrendered for Delivery)

            '
          example: RECEIVED
        amendedBookingStatus:
          maxLength: 50
          type: string
          description: 'The status of latest amendment added to the `Booking`. If no amendment has been requested - then this field is empty. Possible values are:

            - `AMENDMENT_RECEIVED` (An amendment has been received and is awaiting to be processed)

            - `AMENDMENT_CONFIRMED` (Amendment is confirmed)

            - `AMENDMENT_DECLINED` (Amendment discontinued by provider)

            - `AMENDMENT_CANCELLED` (Amendment discontinued by consumer)

            '
          example: AMENDMENT_RECEIVED
        bookingCancellationStatus:
          maxLength: 50
          type: string
          description: 'The status of the latest booking cancellation. If no cancellation has been requested - then this property is empty. Possible values are:

            - `CANCELLATION_RECEIVED` (A request to cancel a Confirmed Booking has been received and is awaiting to be processed)

            - `CANCELLATION_DECLINED` (Cancellation of the Confirmed Booking has been declined by provider)

            - `CANCELLATION_CONFIRMED` (Cancellation of the Confirmed Booking has been confirmed by provider)

            '
          example: CANCELLATION_RECEIVED
        receiptTypeAtOrigin:
          maxLength: 3
          type: string
          description: 'Indicates the type of service offered at `Origin`. The options are:

            - `CY` (Container yard (incl. rail ramp))

            - `SD` (Store Door)

            - `CFS` (Container Freight Station)

            '
          example: CY
          enum:
          - CY
          - SD
          - CFS
        deliveryTypeAtDestination:
          maxLength: 3
          type: string
          description: 'Indicates the type of service offered at `Destination`. The options are:

            - `CY` (Container yard (incl. rail ramp))

            - `SD` (Store Door)

            - `CFS` (Container Freight Station)

            '
          example: CY
          enum:
          - CY
          - SD
          - CFS
        cargoMovementTypeAtOrigin:
          maxLength: 3
          type: string
          description: 'Refers to the shipment term at the **loading** of the cargo into the container. Possible values are:

            - `FCL` (Full Container Load)

            - `LCL` (Less than Container Load)

            '
          example: FCL
        cargoMovementTypeAtDestination:
          maxLength: 3
          type: string
          description: 'Refers to the shipment term at the **unloading** of the cargo out of the container. Possible values are:

            - `FCL` (Full Container Load)

            - `LCL` (Less than Container Load)

            '
          example: FCL
        serviceContractReference:
          maxLength: 30
          type: string
          description: 'Reference number for agreement between shipper and carrier, which optionally includes a certain minimum quantity commitment (usually referred as ��MQC��) of cargo that the shipper commits to over a fixed period, and the carrier commits to a certain rate or rate schedule.


            **Condition:** One of `serviceContractReference` or `contractQuotationReference` must be provided, but not both.

            '
          example: HHL51800000
        freightPaymentTermCode:
          type: string
          description: 'An indicator of whether freight and ancillary fees for the main transport are prepaid (`PRE`) or collect (`COL`). When prepaid the charges are the responsibility of the shipper or the Invoice payer on behalf of the shipper (if provided). When collect, the charges are the responsibility of the consignee or the Invoice payer on behalf of the consignee (if provided).

            - `PRE` (Prepaid)

            - `COL` (Collect)

            '
          example: PRE
          enum:
          - PRE
          - COL
        originChargesPaymentTerm:
          $ref: '#/components/schemas/OriginChargesPaymentTerm'
        destinationChargesPaymentTerm:
          $ref: '#/components/schemas/DestinationChargesPaymentTerm'
        contractQuotationReference:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'Information provided by the shipper to identify whether pricing for the shipment has been agreed via a contract or a quotation reference.


            **Condition:** One of `contractQuotationReference` or `serviceContractReference` must be provided, but not both.

            '
          example: HHL1401
        vessel:
          $ref: '#/components/schemas/Vessel'
        carrierServiceName:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The name of a service as specified by the carrier.


            **Condition:** Mandatory if `carrierExportVoyageNumber` is provided and Vessel details or `carrierServiceCode` are blank

            '
          example: Great Lion Service
        carrierServiceCode:
          maxLength: 11
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The carrier specific code of the service for which the schedule details are published.


            **Condition:** Mandatory if `carrierExportVoyageNumber` is provided and Vessel details or `carrierServiceName` are blank

            '
          example: FE1
        universalServiceReference:
          maxLength: 8
          minLength: 8
          pattern: ^SR\d{5}[A-Z]$
          type: string
          description: 'A global unique service reference, as per DCSA standard, agreed by VSA partners for the service. The service reference must match the regular expression pattern: `SR\d{5}[A-Z]`. The letters `SR` followed by `5 digits`, followed by a checksum-character as a capital letter from `A to Z`.

            '
          example: SR12345A
        carrierExportVoyageNumber:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The carrier specific identifier of the export Voyage.


            **Condition:** Mandatory if `expectedDepartureDate` or `expectedArrivalAtPlaceOfDeliveryStartDate` and `expectedArrivalAtPlaceOfDeliveryEndDate` is not provided.

            '
          example: 2103S
        universalExportVoyageReference:
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
          type: string
          description: 'A global unique voyage reference for the export Voyage, as per DCSA standard, agreed by VSA partners for the voyage. The voyage reference must match the regular expression pattern: `\d{2}[0-9A-Z]{2}[NEWSR]`

            - `2 digits` for the year

            - `2 alphanumeric characters` for the sequence number of the voyage

            - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est, `S`outh or `R`oundtrip).

            '
          example: 2103N
        declaredValue:
          minimum: 0
          type: number
          description: 'The value of the cargo that the shipper declares in order to avoid the carrier''s limitation of liability and "Ad Valorem" freight, i.e., freight which is calculated based on the value of the goods declared by the shipper.

            '
          format: float
          example: 1231.1
        declaredValueCurrency:
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
          type: string
          description: 'The currency used for the declared value, using the 3-character code defined by [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html).


            **Condition:** Mandatory if `declaredValue` is provided

            '
          example: DKK
        carrierCode:
          maxLength: 4
          pattern: ^\S+$
          type: string
          description: 'The `SCAC` code (provided by [NMFTA](https://nmfta.org/scac/)) or `SMDG` code (provided by [SMDG](https://smdg.org/documents/smdg-code-lists/smdg-liner-code-list/)) of the carrier the booking request is intended for. `carrierCodeListProvider` defines which list the `carrierCode` is based upon.

            '
          example: MMCU
        carrierCodeListProvider:
          type: string
          description: 'The code list provider for the `carrierCode`. Possible values are:

            - `SMDG` (Ship Message Design Group)

            - `NMFTA` (National Motor Freight Traffic Association)

            '
          example: NMFTA
          enum:
          - SMDG
          - NMFTA
        isPartialLoadAllowed:
          type: boolean
          description: 'Indicates whether the shipper agrees to load part of the shipment in case not all of the cargo is delivered within cut-off.


            **Note:** The carrier is not liable in case unable to follow the customer''s instructions due to operational constraints. If this value is omitted, it may be interpreted differently by different API providers and by the same API provider in different contexts.

            '
          example: true
        isExportDeclarationRequired:
          type: boolean
          description: 'Information provided by the shipper whether an export declaration is required for this particular shipment/commodity/destination.


            **Note:** If this property is omitted, it may be interpreted differently by different API providers and by the same API provider in different contexts.

            '
          example: true
        exportDeclarationReference:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'Reference number assigned to an Export declaration typically submitted by the exporter (or the freight forwarder on behalf of the exporter) that provides detailed information about the goods being exported. It serves as a record for the exporting country''s government and is used for statistical, regulatory, and compliance purposes. The export declaration must typically be submitted to the relevant customs authorities before the goods leave the exporting country.

            '
          example: ABC123123
        expectedDepartureDate:
          type: string
          description: 'The date when the shipment is expected to be loaded on board a vessel as provided by the shipper or its agent.


            **Condition:** Mandatory if vessel/voyage/service details or `expectedArrivalAtPlaceOfDeliveryDate` is not provided.

            '
          format: date
          example: '2021-05-17T00:00:00.000Z'
        expectedArrivalAtPlaceOfDeliveryStartDate:
          type: string
          description: 'The start date (provided as a range together with `expectedArrivalAtPlaceOfDeliveryEndDate`) for when the shipment is expected to arrive at `Place Of Delivery`.


            **Condition:** Mandatory if vessel/voyage/service details or `expectedDepartureDate` is not provided.

            '
          format: date
          example: '2021-05-17T00:00:00.000Z'
        expectedArrivalAtPlaceOfDeliveryEndDate:
          type: string
          description: 'The end date (provided as a range together with `expectedArrivalAtPlaceOfDeliveryStartDate`) for when the shipment is expected to arrive at `Place Of Delivery`.


            **Condition:** Mandatory if vessel/voyage/service details or `expectedDepartureDate` is not provided.

            '
          format: date
          example: '2021-05-19T00:00:00.000Z'
        transportDocumentTypeCode:
          type: string
          description: 'Specifies the type of the `Transport Document`. Possible values are:

            - `BOL` (Bill of Lading)

            - `SWB` (Sea Waybill)

            '
          example: SWB
          enum:
          - BOL
          - SWB
        transportDocumentReference:
          maxLength: 20
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'A unique reference allocated by the shipping line to the `Transport Document` that the booking concerns.

            '
          example: reserved-HHL123
        bookingChannelReference:
          maxLength: 20
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'Identification number provided by the platform/channel used for booking request/confirmation, ex: Inttra booking reference, or GTNexus, other.


            **Condition:** a booking channel is being used

            '
          example: Inttra reference
        incoTerms:
          maxLength: 3
          type: string
          description: 'Transport obligations, costs and risks as agreed between buyer and seller as defined by [Incoterms Rules](https://iccwbo.org/business-solutions/incoterms-rules/).

            '
          example: FCA
        isEquipmentSubstitutionAllowed:
          type: boolean
          description: 'Indicates if an alternate equipment type can be provided by the carrier.

            '
          example: true
        termsAndConditions:
          maxLength: 50000
          type: string
          description: 'Carrier terms and conditions of transport.

            '
          example: Any reference in...
        invoicePayableAt:
          $ref: '#/components/schemas/InvoicePayableAt'
        placeOfBLIssue:
          $ref: '#/components/schemas/PlaceOfBLIssue'
        references:
          type: array
          description: 'A list of `References`

            '
          items:
            $ref: '#/components/schemas/Reference'
        customsReferences:
          type: array
          description: 'A list of `Customs references`

            '
          items:
            $ref: '#/components/schemas/CustomsReference'
        documentParties:
          $ref: '#/components/schemas/DocumentParties'
        partyContactDetails:
          type: array
          description: "The contact details of the person(s) to contact in relation to the **Booking** (changes, notifications etc.) \n"
          items:
            $ref: '#/components/schemas/PartyContactDetail'
        shipmentLocations:
          minItems: 1
          type: array
          description: 'A list of `Shipment Locations`

            '
          items:
            $ref: '#/components/schemas/ShipmentLocation'
        requestedEquipments:
          minItems: 1
          type: array
          description: 'List of `Requested Equipments`. Multiple containers can be requested within the same booking. For each Requested Equipment object with 2 or more units, it is a condition that the commodity (or list of commodities) defined within the same Requested Equipment object is the same for each requested unit.


            **Example:** 2 x 20'' containing 50% shoes and 50% t-shirts can be requested within the same Requested Equipment object only if each 20'' will contain 50% shoes and 50% t-shirts. If 1 x 20'' will contain 100% shoes and the other 20'' will be 100% t-shirts, 2 separate Requested Equipment objects must be defined.

            '
          items:
            $ref: '#/components/schemas/RequestedEquipment'
        confirmedEquipments:
          type: array
          description: 'A list of `Confirmed Equipments`


            **Condition:** Mandatory and non-empty for a `CONFIRMED` Booking

            '
          items:
            $ref: '#/components/schemas/ConfirmedEquipment'
        transportPlan:
          type: array
          description: 'A list of `Transport` objects (legs) describing the entire transport plan including transshipments.


            **Condition:** Mandatory and non-empty for a `CONFIRMED` Booking

            '
          items:
            $ref: '#/components/schemas/Transport'
        shipmentCutOffTimes:
          type: array
          description: 'A list of cut-off times provided by the carrier in the booking confirmation. A cut-off time indicates the latest deadline within which a task must be completed. The confirmed schedule cannot be guaranteed if a cut-off time is missed. Customs brokers may set additional cut-off times to receive the export customs documentation, which is not included in the shipment cut-off times of a carrier booking.


            **Condition:** Mandatory and non-empty for a `CONFIRMED` Booking

            '
          items:
            $ref: '#/components/schemas/ShipmentCutOffTime'
        advanceManifestFilings:
          type: array
          description: 'A list of `Advance Manifest Filings` provided by the carrier

            '
          items:
            $ref: '#/components/schemas/AdvanceManifestFiling'
        charges:
          type: array
          description: 'A list of `Charges`

            '
          items:
            $ref: '#/components/schemas/Charge'
        carrierClauses:
          type: array
          description: 'Additional clauses for a specific shipment added by the carrier to the Bill of Lading, subject to local rules / guidelines or certain mandatory information required to be shared with the customer.

            '
          items:
            maxLength: 20000
            pattern: ^\S(?:.*\S)?$
            type: string
            description: 'The content of the clause.

              '
            example: It is not allowed to...
        feedbacks:
          type: array
          description: 'Feedback that can be provided includes, but is not limited to:

            - unsupported properties

            - changed values

            - removed properties

            - general information

            '
          items:
            $ref: '#/components/schemas/Feedback'
    BookingAgent:
      title: Booking Agent
      required:
      - partyName
      type: object
      properties:
        partyName:
          maxLength: 70
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'Name of the party.

            '
          example: IKEA Denmark
        address:
          $ref: '#/components/schemas/PartyAddress'
        partyContactDetails:
          minItems: 1
          type: array
          description: 'A list of contact details

            '
          items:
            $ref: '#/components/schemas/PartyContactDetail'
        identifyingCodes:
          type: array
          items:
            $ref: '#/components/schemas/IdentifyingCode'
        taxLegalReferences:
          type: array
          description: 'A list of `Tax References` for a `Party`

            '
          items:
            $ref: '#/components/schemas/TaxLegalReference'
        reference:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'A reference linked to the `Booking Agent`.

            '
          example: HHL007
      description: 'The party placing the booking request on behalf of the customer.

        '
    CargoNetVolume:
      title: Cargo Net Volume
      required:
      - unit
      - value
      type: object
      properties:
        value:
          type: number
          description: 'The estimated net total volume of the cargo.

            '
          format: float
          example: 360
          exclusiveMinimum: 0
        unit:
          type: string
          description: 'The unit of measure which can be expressed in imperial or metric terms:

            - `FTQ` (Cubic foot)

            - `MTQ` (Cubic meter)

            '
          example: MTQ
          enum:
          - MTQ
          - FTQ
      description: 'The estimated net total volume of the cargo.

        '
    Transport:
      title: Transport
      required:
      - dischargeLocation
      - loadLocation
      - plannedArrivalDate
      - plannedDepartureDate
      - transportPlanStage
      - transportPlanStageSequenceNumber
      type: object
      properties:
        transportPlanStage:
          type: string
          description: 'Code qualifying a specific stage of transport e.g. pre-carriage, main carriage transport or on-carriage transport

            - `PRC` (Pre-Carriage)

            - `MNC` (Main Carriage Transport)

            - `ONC` (On-Carriage Transport)

            '
          example: PRC
          enum:
          - PRC
          - MNC
          - ONC
        transportPlanStageSequenceNumber:
          type: integer
          description: 'Sequence number of the transport plan stage

            '
          format: int32
          example: 5
        loadLocation:
          $ref: '#/components/schemas/LoadLocation'
        dischargeLocation:
          $ref: '#/components/schemas/DischargeLocation'
        plannedDepartureDate:
          type: string
          description: 'The planned date of departure.

            '
          format: date
          example: '2021-05-17T00:00:00.000Z'
        plannedArrivalDate:
          type: string
          description: 'The planned date of arrival.

            '
          format: date
          example: '2021-05-19T00:00:00.000Z'
        modeOfTransport:
          maxLength: 50
          type: string
          description: 'The mode of transport as defined by DCSA. The currently supported values include:

            - `VESSEL` (Vessel)

            - `RAIL` (Rail)

            - `TRUCK` (Truck)

            - `BARGE` (Barge)

            - `MULTIMODAL` (if multiple modes are used)

            '
          example: VESSEL
        vesselName:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The name of the Vessel given by the Vessel Operator and registered with IMO.

            '
          example: King of the Seas
        vesselIMONumber:
          maxLength: 8
          minLength: 7
          pattern: ^\d{7,8}$
          type: string
          description: 'The unique reference for a registered Vessel. The reference is the International Maritime Organisation (IMO) number, also sometimes known as the Lloyd&apos;s register code, which does not change during the lifetime of the vessel

            '
          example: '9321483'
        carrierServiceCode:
          maxLength: 11
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The carrier-specific code of the service for which the schedule details are published.

            '
          example: FE1
        universalServiceReference:
          maxLength: 8
          minLength: 8
          pattern: ^SR\d{5}[A-Z]$
          type: string
          description: 'A global unique service reference, as per DCSA standard, agreed by VSA partners for the service. The service reference must match the regular expression pattern: `SR\d{5}[A-Z]`. The letters `SR` followed by `5 digits`, followed by a checksum-character as a capital letter from `A to Z`.

            '
          example: SR12345A
        carrierImportVoyageNumber:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The identifier of an import voyage. The carrier-specific identifier of the import Voyage.

            '
          example: 2103N
        universalImportVoyageReference:
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
          type: string
          description: 'A global unique voyage reference for the import Voyage, as per DCSA standard, agreed by VSA partners for the voyage. The voyage reference must match the regular expression pattern: `\d{2}[0-9A-Z]{2}[NEWSR]`

            - `2 digits` for the year

            - `2 alphanumeric characters` for the sequence number of the voyage

            - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est, `S`outh or `R`oundtrip).

            '
          example: 2103N
        carrierExportVoyageNumber:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The identifier of an export voyage. The carrier-specific identifier of the export Voyage.

            '
          example: 2103S
        universalExportVoyageReference:
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
          type: string
          description: 'A global unique voyage reference for the export Voyage, as per DCSA standard, agreed by VSA partners for the voyage. The voyage reference must match the regular expression pattern: `\d{2}[0-9A-Z]{2}[NEWSR]`

            - `2 digits` for the year

            - `2 alphanumeric characters` for the sequence number of the voyage

            - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est, `S`outh or `R`oundtrip).

            '
          example: 2103N
      description: 'A single `leg` of the `Transport Plan`

        '
    Reference:
      title: Reference
      required:
      - type
      - value
      type: object
      properties:
        type:
          maxLength: 3
          type: string
          description: 'The reference type codes defined by DCSA. Possible values are:

            - `CR` (Customer''s Reference)

            - `ECR` (Empty container release reference)

            - `AKG` (Vehicle Identification Number)

            - `AEF` (Customer Load Reference)

            '
          example: CR
        value:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: "The value of the reference. \n"
          example: HHL00103004
      description: 'References provided by the shipper or freight forwarder at the time of `Booking` or at the time of providing `Shipping Instructions`. Carriers share it back when providing `Track & Trace` event updates, some are also printed on the B/L. Customers can use these references to track shipments in their internal systems.

        '
    ContainerPositioningEstimated:
      title: Container Positioning Estimated
      required:
      - location
      type: object
      properties:
        estimatedDateTime:
          type: string
          description: 'The estimated date and time for the positioning of the container(s) at the `Container Positioning Location` (CPO), if provided, or the `Place of Receipt` (PRE) if CPO location is not provided.


            **Condition:** Only applicable to carrier haulage service at origin (`Receipt type at origin = ''SD''`).

            '
          format: date-time
          example: '2024-09-04T09:41:00.000Z'
        location:
          $ref: '#/components/schemas/ContainerPositioningLocation'
      description: 'An object to capture the `Location` together with an optional `Date and Time`.

        '
    OriginChargesPaymentTerm:
      title: Origin Charges Payment Term
      type: object
      properties:
        haulageChargesPaymentTermCode:
          type: string
          description: 'An indicator of whether the costs for inland transportation to the port, when applicable, are prepaid (`PRE`) or collect (`COL`).


            - `PRE` (Prepaid)

            - `COL` (Collect)

            '
          example: PRE
          enum:
          - PRE
          - COL
        portChargesPaymentTermCode:
          type: string
          description: 'An indicator of whether the origin port charges are prepaid (`PRE`) or collect (`COL`).


            - `PRE` (Prepaid)

            - `COL` (Collect)

            '
          example: PRE
          enum:
          - PRE
          - COL
        otherChargesPaymentTermCode:
          type: string
          description: 'An indicator of whether origin charges (excluding port and haulage) are prepaid (`PRE`) or collect (`COL`).


            - `PRE` (Prepaid)

            - `COL` (Collect)

            '
          example: PRE
          enum:
          - PRE
          - COL
      description: 'An indicator of whether origin charges are prepaid (`PRE`) or collect (`COL`). When prepaid, the charges are the responsibility of the shipper or the Invoice payer on behalf of the shipper (if provided). When collect, the charges are the responsibility of the consignee or the Invoice payer on behalf of the consignee (if provided).

        '
    NetWeight:
      title: Net Weight
      required:
      - unit
      - value
      type: object
      properties:
        value:
          type: number
          description: 'Total weight of the goods carried, excluding packaging.

            '
          format: float
          example: 2.4
          exclusiveMinimum: 0
        unit:
          type: string
          description: 'The unit of measure which can be expressed in imperial or metric terms:

            - `KGM` (Kilograms)

            - `LBR` (Pounds)

            '
          example: KGM
          enum:
          - KGM
          - LBR
      description: 'Total weight of the goods carried, excluding packaging.

        '
    LoadLocation:
      title: Load Location
      type: object
      properties:
        locationName:
          maxLength: 100
          pattern: ^\S(?:.*\S)?$
          type: string
          description: The name of the location.
          example: Port of Amsterdam
        address:
          $ref: '#/components/schemas/Address'
        facility:
          $ref: '#/components/schemas/Facility'
        UNLocationCode:
          maxLength: 5
          minLength: 5
          pattern: ^[A-Z]{2}[A-Z2-9]{3}$
          type: string
          description: 'The UN Location code specifying where the place is located. The pattern used must be


            - 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

            - 3 characters to code a location within that country. Letters A-Z and numbers from 2-9 can be used


            More info can be found here: [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)

            '
          example: NLAMS
      description: 'An object to capture the `Load Location`.


        The location can be specified in **any** of the following ways: `UN Location Code`, `Facility` or an `Address`.


        **Condition:** It is expected that if a location is specified in multiple ways (e.g. both as an `Address` and as a `Facility`) that both ways point to the same location.

        '
      example:
        locationName: Shanghai Shengdong International Container Terminal
        UNLocationCode: CNSGH
        facility:
          facilityCode: SHENG
          facilityCodeListProvider: SMDG
    PartyAddress:
      title: Party Address
      required:
      - city
      - countryCode
      - street

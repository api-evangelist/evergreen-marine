openapi: 3.2.0
info:
  title: Evergreen Marine Notifications API
  version: 2.0.0
  description: 'Operations tagged Notifications across 2 of this provider''s published API definitions: evergreen-marine-booking-openapi.json, evergreen-marine-booking-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Notifications
  description: Notifications to be implemented by the **consumers** of the Booking API
paths:
  /booking-notifications:
    post:
      tags:
      - Notifications
      summary: Send a new Booking Notification
      description: 'Creates a new `Booking Notification`. This endPoint is called whenever a `Booking` that a consumer has subscribed to changes state or is updated.


        **This endPoint is to be implemented by a consumer of the Booking API in order to receive Notifications**'
      operationId: booking-notifications
      parameters:
      - name: API-Version
        in: header
        description: 'An API-Version header **MAY** be added to the request (optional); if added it **MUST** only contain **MAJOR** version. API-Version header **MUST** be aligned with the URI version.

          '
        required: false
        style: simple
        explode: false
        schema:
          type: string
          example: '2'
      requestBody:
        description: 'The payload used to create a [`Booking Notification`](#/BookingNotification)

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingNotification'
            examples:
              receivedLightweightExample:
                summary: 'Booking request received (Lightweight)

                  '
                description: 'A lightweight notification explaining that a `Booking Request` has been received and stored in provider system (`bookingStatus=''CONFIRMED''`).

                  '
                value:
                  id: 521e076e-599c-4ba2-ace0-ef012d9693e0
                  source: https://www.evergreen-line.com
                  specversion: '1.0'
                  type: org.dcsa.booking.v2
                  datacontenttype: application/json
                  time: '2025-03-17T00:47:00.000Z'
                  data:
                    bookingStatus: CONFIRMED
                    amendedBookingStatus: ''
                    carrierBookingRequestReference: EGLV_25031700378628
                    carrierBookingReference: '142500005390'
                  subscriptionReference: 142500005390_AC3
              receivedFullStateTransferExample:

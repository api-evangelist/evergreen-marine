            '
          example: EMC007123
        issueDate:
          type: string
          description: 'Issue date of the `Export License` applicable to the booking.

            '
          format: date
          example: '2024-09-14T00:00:00.000Z'
        expiryDate:
          type: string
          description: 'Expiry date of the `Export License` applicable to the booking.


    TaxLegalReference:
      title: Tax & Legal Reference
      required:
      - countryCode
      - type
      - value
      type: object
      properties:
        type:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The reference type code as defined by the relevant tax and/or legal authority.

            '
          example: PAN
        countryCode:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
          type: string
          description: 'The 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

            '
          example: IN
        value:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The value of the `taxLegalReference`

            '
          example: AAAAA0000A
      description: 'Reference that uniquely identifies a party for tax and/or legal purposes in accordance with the relevant jurisdiction.


        A small list of **potential** examples:


        | Type  | Country | Description |

        |-------|:-------:|-------------|

        |PAN|IN|Goods and Services Tax Identification Number in India|

        |GSTIN|IN|Goods and Services Tax Identification Number in India|

        |IEC|IN|Importer-Exported Code in India|

        |RUC|EC|Registro Unico del Contribuyente in Ecuador|

        |RUC|PE|Registro Unico del Contribuyente in Peru|

        |NIF|MG|Numero d''Identification Fiscal in Madagascar|

        |NIF|DZ|Numero d''Identification Fiscal in Algeria|

        '
    Feedback:
      title: Feedback
      required:
      - code
      - message
      - severity
      type: object
      properties:
        severity:
          maxLength: 50
          type: string
          description: 'The severity of the feedback. Possible values are:

            - `INFO` (Information - "Your reefer container will use renewable energy", "This earlier / premium service is available")

            - `WARN` (Warning - "I''m going to replace" / "Ignore this value" / "Use another value instead")

            - `ERROR` (Error - "This must be changed!")

            '
          example: WARN
        code:
          maxLength: 50
          type: string
          description: "A code used to describe the feedback. Possible values are:\n- `INFORMATIONAL_MESSAGE` (INFO - to be used when providing extra information) \n- `PROPERTY_WILL_BE_IGNORED` (WARN - to be used for unsupported properties/values)\n- `PROPERTY_VALUE_MUST_CHANGE` (ERROR - to be used when a wrong property/value is provided)\n- `PROPERTY_VALUE_HAS_BEEN_CHANGED` (WARN - when something has been auto-updated without consumer intervention)\n- `PROPERTY_VALUE_MAY_CHANGE` (WARN - when something is likely to change in the future)\n- `PROPERTY_HAS_BEEN_DELETED` (WARN - when something has been auto-deleted without consumer intervention)\n"
          example: PROPERTY_WILL_BE_IGNORED
        message:
          maxLength: 5000
          type: string
          description: 'A description with additional information.

            '
          example: Spaces not allowed in facility code
        jsonPath:
          maxLength: 500
          type: string
          description: 'A path to the property, formatted according to [JSONpath](https://github.com/json-path/JsonPath).

            '
          example: $.location.facilityCode
        property:
          maxLength: 100
          type: string
          description: 'The name of the property causing the error/warning.

            '
          example: facilityCode
      description: 'Feedback that can be provided includes, but is not limited to:

        - unsupported properties

        - changed values

        - removed properties

        - general information

        '
    EmergencyContactDetails:
      title: Emergency Contact Details
      required:
      - contact
      - phone

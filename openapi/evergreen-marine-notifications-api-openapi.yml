            '
          format: float
          example: 36000
          exclusiveMinimum: 0
        unit:
          type: string
          description: 'The unit of measure which can be expressed in imperial or metric terms:

            - `KGM` (Kilograms)

            - `LBR` (Pounds)

            '
          example: KGM
          enum:
          - KGM
          - LBR
      description: 'The estimated grand total gross weight of the cargo, including packaging items being carried, which can be expressed in imperial or metric terms, as provided by the shipper.


        **Condition:** Mandatory if not provided on `Commodity` level

        '
    ServiceContractOwner:
      title: Service Contract Owner
      required:
      - partyName
      type: object

          example: true
        reference:
          maxLength: 35
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'Reference number assigned to an `Import License` or permit, issued by countries exercising import controls that athorizes the importation of the articles stated in the license. The `Import License` must be valid at time of arrival.

            '

        purchaseOrderReferences:
          type: array
          description: 'A list of `Purchase Order Reference`s linked to the `Consignee`.

            '
          items:
            maxLength: 35
            pattern: ^\S(?:.*\S)?$
            type: string
            description: 'A purchase order reference linked to the `Consignee`.

              '
            example: HHL007
      description: 'The party to which goods are consigned in the Master Bill of Lading.

        '
    NationalCommodityCode:
      title: National Commodity Code
      required:
      - type
      - values
      type: object
      properties:
        type:
          maxLength: 10
          pattern: ^\S(?:.*\S)?$
          type: string
          description: 'The national commodity classification code, which can be one of the following values defined by DCSA:

            - `NCM` (Nomenclatura Comum do Mercosul)

            - `HTS` (Harmonized Tariff Schedule)

            - `SCHEDULE_B` ( Schedule B)

            - `TARIC` (Integrated Tariff of the European Communities)

            - `CN` (Combined Nomenclature)

            - `CUS` (Customs Union and Statistics)

            '
          example: NCM
        countryCode:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
          type: string
          description: 'The 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

            '
          example: BR
        values:
          minItems: 1
          type: array
          description: 'A list of `national commodity codes` values.

            '
          example:
          - '1515'
          - '2106'
          - '2507'
          - '2512'
          items:
            maxLength: 10
            pattern: ^\S(?:.*\S)?$
            type: string
            description: 'The value of the `National Commodity Code`

              '
            example: '1515'
      description: 'The national commodity classification code linked to a country with a value.


        An example could look like this:


        | Type  | Country | Value |

        |-------|:-------:|-------------|

        |NCM|BR|[''1515'', ''2106'', ''2507'', ''2512'']|

        '
    EmptyContainerPickup:
      title: Empty Container Pickup
      type: object
      properties:
        dateTime:
          type: string
          description: 'The date and time for the pick-up of the empty container(s) at the Empty container depot release location, if provided.

            '

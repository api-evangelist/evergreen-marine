openapi: 3.2.0
info:
  title: Evergreen Marine Point To Point API
  version: 1.0.0
  description: 'Operations tagged Point To Point across 2 of this provider''s published API definitions: evergreen-marine-commercial-schedules-openapi.json, evergreen-marine-commercial-schedules-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Point To Point
  description: ' '
paths:
  /server/sol/route/commercial/v1/point-to-point-routes:
    get:
      tags:
      - Point To Point
      summary: Point to Point Routing
      description: 'Provides the product offering of single or multiple estimated end-to-end route options for a shipment in the pre-booking phase. This includes point-to-point specification of all transport legs, estimated timings, estimated schedules and interdependencies between transport legs.


        The list of solutions returned in the response can be tailored to a specific need by combining available query parameters.


        The minimum required query parameters are `placeOfReceipt` and `placeOfDelivery`. If no further query parameters are used to tailor the response, the provider of the GET endpoint will return their best suggestions in the response.


        The `GET /server/sol/route/commercial/v1/point-to-point-routes` endpoint can be implemented independently of having implemented the `GET /server/sol/mvs1api/commSch/v1/port` and `GET /server/sol/mvs1api/commSch/v1/vessel` endpoints.'
      operationId: get-v1-point-to-point
      parameters:
      - name: placeOfReceipt
        in: query
        description: The `UNLocationCode` specifying where the place is located.
        required: true
        style: form
        explode: true
        schema:
          maxLength: 5
          minLength: 5
          pattern: ^[A-Z]{2}[A-Z2-9]{3}$
          type: string
          example: NLAMS
      - name: placeOfDelivery
        in: query
        description: The `UNLocationCode` specifying where the place is located.
        required: true
        style: form
        explode: true
        schema:
          maxLength: 5
          minLength: 5
          pattern: ^[A-Z]{2}[A-Z2-9]{3}$
          type: string
          example: NLAMS
      - name: departureStartDate
        in: query
        description: "Limit the result based on the earliest departureDate. \n- If provided without departureEndDate, returns all routings with departures from the specified departureStartDate onwards.\n- If provided with departureEndDate, returns all routings with departures within the specified date range, inclusive of both dates.\n- If the same date is provided for both departureStartDate and departureEndDate, returns all routings with departures on that specific date.\n"
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date
          example: '2021-04-01'
      - name: departureEndDate
        in: query
        description: "Limit the result based on the latest departureDate. \n- If provided without departureStartDate, returns all routings with departures up to the specified departureEndDate.\n- If provided with departureStartDate, returns all routings with departures within the specified date range, inclusive of both dates.\n- If the same date is provided for both departureStartDate and departureEndDate, returns all routings with departures on that specific date.\n"
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date
          example: '2021-05-01'
      - name: arrivalStartDate
        in: query
        description: 'Limit the result based on the earliest arrivalDate.

          - If provided without arrivalEndDate, returns all routings with arrivals from the specified arrivalStartDate.

          - If provided with arrivalEndDate, returns all routings with arrivals within the specified date range, inclusive of both dates.

          - If the same date is provided for both arrivalStartDate and arrivalEndDate, returns all routings with arrivals on that specific date.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date
          example: '2021-04-01'
      - name: arrivalEndDate
        in: query
        description: 'Limit the result based on the latest arrivalDate.

          - If provided without arrivalStartDate, returns all routings with arrivals up to the specified arrivalEndDate.

          - If provided with arrivalStartDate, returns all routings with arrivals within the specified date range, inclusive of both dates.

          - If the same date is provided for both arrivalStartDate and arrivalEndDate, returns all routings with arrivals on that specific date.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date
          example: '2021-05-01'
      - name: maxTranshipment
        in: query
        description: Specifies the maximum number of transhipments that the proposed routings can have in the response. By default, transhipments are allowed and the responses can have either direct routings or routings with transhipment. The default value of maximum transhipments is defined by the carrier for when the consumer does not provide a value. If the user sets the number of transhipments to 0, only direct routings can be returned in the response.
        required: false
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          format: int32
          example: 1
      - name: receiptTypeAtOrigin
        in: query
        description: 'Indicates the type of service offered at Origin. **Carriers can choose to define a default value when the consumer does not provide it.** - `CY` (Container yard (incl. rail ramp))   - `SD` (Store Door)   - `CFS` (Container Freight Station)

          '
        required: false
        style: form
        explode: true
        schema:
          maxLength: 3
          type: string
          example: CY
          enum:
          - CY
          - SD
          - CFS
      - name: deliveryTypeAtDestination
        in: query
        description: 'Indicates the type of service offered at Destination. **Carriers can choose to define a default value when the consumer does not provide it.** - `CY` (Container yard (incl. rail ramp))   - `SD` (Store Door)   - `CFS` (Container Freight Station)

          '
        required: false
        style: form
        explode: true
        schema:
          maxLength: 3
          type: string
          example: CY
          enum:
          - CY
          - SD
          - CFS
      - name: limit
        in: query
        description: Specifies the maximum number of `Point-to-Point` objects to return.
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
          example: 100
          default: 100
      - name: cursor
        in: query
        description: A server generated value to specify a specific point in a collection result, used for pagination.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 1024
          type: string
        example: fE9mZnNldHw9MTAmbGltaXQ9MTA
      - name: API-Version
        in: header
        description: 'An API-Version header **MAY** be added to the request (optional); if added it **MUST** only contain **MAJOR** version. API-Version header **MUST** be aligned with the URI version.

          '
        required: false
        style: simple
        explode: false
        schema:
          type: string
          example: '1'
      responses:
        '200':
          description: OK
          headers:
            API-Version:
              description: 'SemVer used to indicate the version of the contract (API version) returned

                '
              style: simple
              explode: false
              schema:
                type: string
                example: 1.0.0
            Next-Page-Cursor:
              description: 'The Next-Page-Cursor header contains a cursor value that points to the next page of results in a paginated API response.

                When an initial `GET` endpoint request includes the query parameter `limit=...` the API provider limits the number of items in the root array of the response to the specified limit. If the response would contain more items than the specified limit, the API provider includes only the first set of limit items and appends the following response header:

                `Next-Page-Cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA`, a string that acts as a reference for the next page of results. The cursor value is used in subsequent requests to retrieve the next page by passing it as a query parameter: `?cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA`.


                To retrieve the next page, the API consumer sends a `GET` request to the endpoint URL with only `?cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA` as query parameter. The limit of items per page and any other query parameters may not be altered, therefore it may also not be specified when requesting subsequent pages. The API provider must ignore any query parameters passed along with a cursor, and should return a `400` error if any other query parameter is passed along with the `cursor`.

                '
              style: simple
              explode: false
              schema:
                maxLength: 1024
                type: string
                example: fE9mZnNldHw9MTAmbGltaXQ9MTA
          content:
            application/json:
              schema:
                type: array
                items:
                  title: Point to Point
                  required:
                  - legs
                  - placeOfDelivery
                  - placeOfReceipt
                  type: object
                  properties:
                    placeOfReceipt:
                      title: Place of Receipt
                      required:
                      - dateTime
                      - facilityTypeCode
                      - location
                      type: object
                      properties:
                        facilityTypeCode:
                          maxLength: 4
                          type: string
                          description: 'The code to identify the specific type of facility. The code indicates which role the facility plays during the transportCall.

                            - `BORD` (Border)

                            - `CLOC` (Customer Location)

                            - `COFS` (Container Freight Station)

                            - `OFFD` (Off Dock Storage)

                            - `DEPO` (Depot)

                            - `INTE` (Inland Terminal)

                            - `POTE` (Port Terminal)

                            - `PBPL` (Pilot Boarding Place)

                            - `BRTH` (Berth)

                            - `RAMP` (Ramp)

                            - `WAYP` (Waypoint)

                            '
                          example: POTE
                        location:
                          title: Location
                          type: object
                          properties:
                            locationName:
                              maxLength: 100
                              pattern: ^\S(?:.*\S)?$
                              type: string
                              description: An optional name for the location.
                              example: Port of Amsterdam
                            address:
                              title: Address
                              required:
                              - city
                              - countryCode
                              - street
                              type: object
                              properties:
                                street:
                                  maxLength: 70
                                  type: string
                                  description: The name of the street.
                                  example: Ruijggoordweg
                                streetNumber:
                                  maxLength: 50
                                  type: string
                                  description: The number of the street.
                                  example: '100'
                                floor:
                                  maxLength: 50
                                  pattern: ^\S(?:.*\S)?$
                                  type: string
                                  description: The floor of the street number.
                                  example: N/A
                                postCode:
                                  maxLength: 10
                                  type: string
                                  description: The post code.
                                  example: 1047 HM
                                city:
                                  maxLength: 35
                                  pattern: ^\S(?:.*\S)?$
                                  type: string
                                  description: The name of the city.
                                  example: Amsterdam
                                stateRegion:
                                  maxLength: 65
                                  type: string
                                  description: The name of the state/region.
                                  example: North Holland
                                countryCode:
                                  maxLength: 2
                                  minLength: 2
                                  pattern: ^[A-Z]{2}$
                                  type: string
                                  description: 'The 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

                                    '
                                  example: NL
                              description: An object for storing address related information.
                            UNLocationCode:
                              maxLength: 5
                              minLength: 5
                              pattern: ^[A-Z]{2}[A-Z2-9]{3}$
                              type: string
                              description: 'The UN Location code specifying where the place is located. The pattern used must be


                                - 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

                                - 3 characters to code a location within that country. Letters A-Z and numbers from 2-9 can be used


                                More info can be found here: [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)

                                '
                              example: NLAMS
                            facility:
                              title: Facility
                              required:
                              - facilityCode
                              - facilityCodeListProvider
                              type: object
                              properties:
                                facilityCode:
                                  maxLength: 6
                                  pattern: ^\S(?:.*\S)?$
                                  type: string
                                  description: 'The code used for identifying the specific facility. This code does not include the UN Location Code.The definition of the code depends on the `facilityCodeListProvider`. As code list providers maintain multiple codeLists the following codeList is used: - for `SMDG` - the codeList used is the [SMDG Terminal Code List](https://smdg.org/documents/smdg-code-lists/) - for `BIC`  - the codeList used is the [BIC Facility Codes](https://www.bic-code.org/facility-codes/)

                                    '
                                  example: ADT
                                facilityCodeListProvider:
                                  type: string
                                  description: "The provider used for identifying the facility Code. Some facility codes are only defined in combination with an `UN Location Code`.\n- `BIC` (Requires a UN Location Code) \n- `SMDG` (Requires a UN Location Code)\n"
                                  example: SMDG
                                  enum:
                                  - BIC
                                  - SMDG
                              description: A way to express a location using a `Facility`. The facility can either be expressed using a `BIC` code or a `SMDG` code. The `facilityCode` does not contain the `UNLocationCode` - this should be provided in the `UnLocationCode` attribute.
                          description: 'The location can be specified using **any** of the nested structures:

                            - `Address` (used to specify the location via an Address)

                            - `UNLocationCode`

                            - `Facility` (used to specify a location using a `facilityCode` and a `facilityCodeListProvider`)


                            It is expected that if a location is specified in multiple ways (both as an `Address` and as a `Facility`) that both ways point to the same location.

                            '
                        dateTime:
                          type: string
                          description: The local date and time, when the event will take place, in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format specifying the offset.
                          format: date-time
                          example: '2025-01-14T09:21:00+01:00'
                      description: 'The Location specifying where the place of receipt is located.

                        '
                    placeOfDelivery:
                      title: Place of Delivery
                      required:
                      - dateTime
                      - facilityTypeCode
                      - location
                      type: object
                      properties:
                        facilityTypeCode:
                          maxLength: 4
                          type: string
                          description: 'The code to identify the specific type of facility. The code indicates which role the facility plays during the transportCall.

                            - `BORD` (Border)

                            - `CLOC` (Customer Location)

                            - `COFS` (Container Freight Station)

                            - `OFFD` (Off Dock Storage)

                            - `DEPO` (Depot)

                            - `INTE` (Inland Terminal)

                            - `POTE` (Port Terminal)

                            - `PBPL` (Pilot Boarding Place)

                            - `BRTH` (Berth)

                            - `RAMP` (Ramp)

                            - `WAYP` (Waypoint)

                            '
                          example: POTE
                        location:
                          title: Location
                          type: object
                          properties:
                            locationName:
                              maxLength: 100
                              pattern: ^\S(?:.*\S)?$
                              type: string
                              description: An optional name for the location.
                              example: Port of Amsterdam
                            address:
                              title: Address
                              required:
                              - city
                              - countryCode
                              - street
                              type: object
                              properties:
                                street:
                                  maxLength: 70
                                  type: string
                                  description: The name of the street.
                                  example: Ruijggoordweg
                                streetNumber:
                                  maxLength: 50
                                  type: string
                                  description: The number of the street.
                                  example: '100'
                                floor:
                                  maxLength: 50
                                  pattern: ^\S(?:.*\S)?$
                                  type: string
                                  description: The floor of the street number.
                                  example: N/A
                                postCode:
                                  maxLength: 10
                                  type: string
                                  description: The post code.
                                  example: 1047 HM
                                city:
                                  maxLength: 35
                                  pattern: ^\S(?:.*\S)?$
                                  type: string
                                  description: The name of the city.
                                  example: Amsterdam
                                stateRegion:
                                  maxLength: 65
                                  type: string
                                  description: The name of the state/region.
                                  example: North Holland
                                countryCode:
                                  maxLength: 2
                                  minLength: 2
                                  pattern: ^[A-Z]{2}$
                                  type: string
                                  description: 'The 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

                                    '
                                  example: NL
                              description: An object for storing address related information.
                            UNLocationCode:
                              maxLength: 5
                              minLength: 5
                              pattern: ^[A-Z]{2}[A-Z2-9]{3}$
                              type: string
                              description: 'The UN Location code specifying where the place is located. The pattern used must be


                                - 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

                                - 3 characters to code a location within that country. Letters A-Z and numbers from 2-9 can be used


                                More info can be found here: [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)

                                '
                              example: NLAMS
                            facility:
                              title: Facility
                              required:
                              - facilityCode
                              - facilityCodeListProvider
                              type: object
                              properties:
                                facilityCode:
                                  maxLength: 6
                                  pattern: ^\S(?:.*\S)?$
                                  type: string
                                  description: 'The code used for identifying the specific facility. This code does not include the UN Location Code.The definition of the code depends on the `facilityCodeListProvider`. As code list providers maintain multiple codeLists the following codeList is used: - for `SMDG` - the codeList used is the [SMDG Terminal Code List](https://smdg.org/documents/smdg-code-lists/) - for `BIC`  - the codeList used is the [BIC Facility Codes](https://www.bic-code.org/facility-codes/)

                                    '
                                  example: ADT
                                facilityCodeListProvider:
                                  type: string
                                  description: "The provider used for identifying the facility Code. Some facility codes are only defined in combination with an `UN Location Code`.\n- `BIC` (Requires a UN Location Code) \n- `SMDG` (Requires a UN Location Code)\n"
                                  example: SMDG
                                  enum:
                                  - BIC
                                  - SMDG
                              description: A way to express a location using a `Facility`. The facility can either be expressed using a `BIC` code or a `SMDG` code. The `facilityCode` does not contain the `UNLocationCode` - this should be provided in the `UnLocationCode` attribute.
                          description: 'The location can be specified using **any** of the nested structures:

                            - `Address` (used to specify the location via an Address)

                            - `UNLocationCode`

                            - `Facility` (used to specify a location using a `facilityCode` and a `facilityCodeListProvider`)


                            It is expected that if a location is specified in multiple ways (both as an `Address` and as a `Facility`) that both ways point to the same location.

                            '
                        dateTime:
                          type: string
                          description: The local date and time, when the event will take place, in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format specifying the offset.
                          format: date-time
                          example: '2025-01-14T09:21:00+01:00'
                      description: 'The Location specifying where the place of delivery is located.

                        '
                    receiptTypeAtOrigin:
                      maxLength: 3
                      type: string
                      description: 'Indicates the type of service offered at `Origin`. The options are:

                        - `CY` (Container yard (incl. rail ramp))

                        - `SD` (Store Door)

                        - `CFS` (Container Freight Station)

                        '
                      example: CY
                      enum:
                      - CY
                      - SD
                      - CFS
                    deliveryTypeAtDestination:
                      maxLength: 3
                      type: string
                      description: 'Indicates the type of service offered at `Destination`. The options are:

                        - `CY` (Container yard (incl. rail ramp))

                        - `SD` (Store Door)

                        - `CFS` (Container Freight Station)

                        '
                      example: CY
                      enum:
                      - CY
                      - SD
                      - CFS
                    cutOffTimes:
                      type: array
                      description: A list of cut-offs times provided by the carrier when available. A cut-off time indicates the latest date and time by which a task must be completed. For example, the latest date and time by which a container must be delivered to a terminal to be loaded on a vessel, or where certain documentation must be provided by the Shipper.
                      items:
                        title: Cut-Off Time
                        required:
                        - cutOffDateTime
                        - cutOffDateTimeCode
                        type: object
                        properties:
                          cutOffDateTimeCode:
                            maxLength: 3
                            type: string
                            description: 'Code for the cut-off time. Possible values are: - `DCO` (Documentation cut-off) - `VCO` (VGM cut-off) - `FCO` (FCL delivery cut-off) - `LCO` (LCL delivery cut-off) **Condition:** only when the `Receipt Type at Origin` is `CFS` - `PCO` (Port cut-off) - `ECP` (Empty container pick-up date and time) - `EFC` (Earliest full-container delivery date) - `RCO` (Reefer cut-off) - `DGC` (Dangerous Goods cut-off) - `OBC` (OOG/BB cut-off) - `TCO` (Transhipment cut-off) - `STA` (Standard booking acceptance) - `SPA` (Special booking acceptance) - `CUA` (Customs Acceptance) - `AFC` (Advanced filling cut-off)

                              More details can be found on [GitHub](https://github.com/dcsaorg/DCSA-OpenAPI/blob/master/reference-data/CutOffDateTimeCodeList-CS_v1.0.0.csv)

                              '
                            example: DCO
                          cutOffDateTime:
                            type: string
                            description: Estimated cut-off time expressed in local time with offset following [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.
                            format: date-time
                            example: '2019-11-12T07:41:00-08:30'
                        description: Cut Off Times.
                    solutionNumber:
                      minimum: 1
                      type: integer
                      description: Solution number, starting with 1. Used to group and identify similar or same routings in the response as per the carrier commercial definitions.
                      format: int32
                      example: 1
                    transitTime:
                      type: integer
                      description: The estimated total time in days that it takes a shipment to move from place of receipt to place of delivery. Transit time includes stop-over time during transhipments and waiting time at connection points, if applicable, thus can vary between the same locations.
                      format: int32
                      example: 10
                    legs:
                      minItems: 1
                      type: array
                      items:
                        title: Leg
                        required:
                        - arrival
                        - departure
                        type: object
                        properties:
                          sequenceNumber:
                            type: integer
                            description: Sequence number of the leg.
                            format: int32
                            example: 1
                          transport:
                            description: The mode of transport as defined by DCSA.
                            oneOf:
                            - title: Vessel Transport
                              required:
                              - modeOfTransport
                              type: object
                              properties:
                                modeOfTransport:
                                  type: string
                                  description: The mode of transport as defined by DCSA. For the Vessel Transport mode this needs to be `VESSEL`.
                                  example: VESSEL
                                  enum:
                                  - VESSEL
                                portVisitReference:
                                  maxLength: 50
                                  type: string
                                  description: The unique reference that can be used to link different `transportCallReferences` to the same port visit. The reference is provided by the port to uniquely identify a port call.
                                  example: NLAMS1234589
                                transportCallReference:
                                  maxLength: 100
                                  type: string
                                  description: The unique reference for a transport call. It’s the vessel operator’s responsibility to provide the Transport Call Reference, other parties are obliged to pick it up and use it. It can take the form of Port Call References as defined in OVS Definitions Document, or alternatively a reference as defined by the vessel operator.
                                  example: SR11111X-9321483-2107W-NLAMS-ACT-1-1
                                servicePartners:
                                  type: array
                                  items:
                                    title: Service Partner
                                    type: object
                                    properties:
                                      carrierCode:
                                        maxLength: 4
                                        pattern: ^\S+$
                                        type: string
                                        description: The carrier code based on either the SMDG or SCAC code lists.
                                        example: MAEU
                                      carrierCodeListProvider:
                                        type: string
                                        description: Identifies the code list provider used for the `carrierCode`.
                                        example: NMFTA
                                        enum:
                                        - SMDG
                                        - NMFTA
                                      carrierServiceName:
                                        maxLength: 50
                                        pattern: ^\S(?:.*\S)?$
                                        type: string
                                        description: The name of the service.
                                        example: Great Lion Service
                                      carrierServiceCode:
                                        maxLength: 11
                                        pattern: ^\S(?:.*\S)?$
                                        type: string
                                        description: The carrier-specific code of the service for which the schedule details are published.
                                        example: FE1
                                      carrierImportVoyageNumber:
                                        maxLength: 50
                                        pattern: ^\S(?:.*\S)?$
                                        type: string
                                        description: The identifier of an import voyage. The carrier-specific identifier of the import Voyage.
                                        example: 2103S
                                      carrierExportVoyageNumber:
                                        maxLength: 50
                                        pattern: ^\S(?:.*\S)?$
                                        type: string
                                        description: The identifier of an export voyage. The carrier-specific identifier of the export Voyage.
                                        example: 2103N
                                    description: The service code and voyage number as identified by the carriers that are partners in the service.
                                universalServiceReference:
                                  maxLength: 8
                                  minLength: 8
                                  pattern: ^SR\d{5}[A-Z]$
                                  type: string
                                  description: 'A global unique service reference, as per DCSA standard, agreed by VSA partners for the service. The service reference must match the regular expression pattern: `SR\d{5}[A-Z]`. The letters `SR` followed by `5` digits, followed by a checksum-character as a capital letter from `A to Z`.

                                    '
                                  example: SR12345A
                                universalExportVoyageReference:
                                  maxLength: 5
                                  minLength: 5
                                  pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
                                  type: string
                                  description: 'A global unique voyage reference for the export Voyage, as per DCSA standard, agreed by VSA partners for the voyage. The voyage reference must match the regular expression pattern: `\d{2}[0-9A-Z]{2}[NEWSR]`


                                    - `2 digits` for the year

                                    - `2 alphanumeric characters` for the sequence number of the voyage

                                    - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est, `S`outh or `R`oundtrip).

                                    '
                                  example: 2103N
                                universalImportVoyageReference:
                                  maxLength: 5
                                  minLength: 5
                                  pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
                                  type: string

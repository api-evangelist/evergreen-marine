              - `SHIPPERSLOADSTOWWEIGHTANDCOUNT` (Shipper''s Load, Stow, Weight and Count)

              - `INTRANSITCLAUSE` (In transit clause)

              '
            example: CARGO_CARGOSPECIFICS
      required:

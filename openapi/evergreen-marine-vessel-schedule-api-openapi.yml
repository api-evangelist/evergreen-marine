openapi: 3.2.0
info:
  title: Evergreen Marine Vessel Schedule API
  version: 1.0.0
  description: 'Operations tagged Vessel Schedule across 2 of this provider''s published API definitions: evergreen-marine-commercial-schedules-openapi.json, evergreen-marine-commercial-schedules-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Vessel Schedule
  description: ' '
paths:
  /server/sol/mvs1api/commSch/v1/vessel:
    get:
      tags:
      - Vessel Schedule
      summary: Vessel Schedule
      description: 'Provides, for a required specific service and/or voyage and/or vessel and/or location, the timetable of estimated departure and arrival times for each port call on the rotation of the vessel(s).


        The list of schedules returned in the response can be tailored to specific needs by combining available query parameters.


        A filter parameter or a combination of filter parameters MUST always be provided to call the endpoint. Examples of typical query parameters and expected payload returned in the response:


        - a) `carrierServiceCode`: Get all vessels and their full voyages within a service


        - b) `carrierServiceCode` **&** `carrierVoyageNumber`: Get a specific full voyage within a service


        - c) `carrierServiceCode` **&** `vesselIMONumber`: Get a specific vessel’s full voyages within a service.


        - d) `vesselIMONumber`: Get all full voyages for a specific vessel across all the services in which it is involved.


        - e) `UNLocationCode`: Get all vessels and their full voyages where the specific `UNLocationCode` is involved


        - f) `UNLocationCode` **&** `facilitySMDGCode`: Get all vessels and their full voyages where the specific `UNLocationCode` and `facilitySMDGCode` is involved


        Other combinations using `vesselName`, `universalServiceReference`, `universalVoyageReference`, `vesselOperatorCarrierCode`, `startDate`, `endDate` are possible.


        The filter parameters `startDate` and `endDate` MUST always be used in combination with any of the other available parameters.


        The resulting payload returned in the responses will always include **entire voyage(s) being matched**. This means that even though a filter only matches a single `Port` (`UNLocationCode`) in a `Voyage` or a single `Timestamp` within a `Port` in a `Voyage` - **the entire Voyage matched** is returned. If the `carrierImportVoyageNumber` of the `Port` differs from the `carrierExportVoyageNumber` of the `Port` then the **entire Voyage** for both these Voyage numbers are included. An example of this is when `&UNLocationCode=DEHAM` is used as a filter parameter. In this case **entire Voyages** would be listed where `DEHAM` is a `Port`.


        Be aware that it is possible to specify filters that are mutually exclusive resulting in an empty response list. An example of this could be when both using `vesselIMONumber` and `vesselName` filters at the same time: `&vesselIMONumber=9321483&vesselName=King of the Seas`. If no `Vessel` exists where `vesselIMONumber` is **9321483** and `vesselName` is **King of the Seas** then the result will be an empty list.


        If no `startDate` filter is provided, then **3 months** before the request date should be used as default. If no `endDate` filter is provided, then **6 months** after the request date should be used as default. The endpoint provider can customize these based on their business definitions and inform the consumers what to expect in a response when these filters are not used.


        The `GET /server/sol/mvs1api/commSch/v1/vessel` endpoint can be implemented independently of having implemented the `GET /server/sol/route/commercial/v1/point-to-point-routes` and `GET /server/sol/mvs1api/commSch/v1/port` endpoints.


        **IMPORTANT**: This endpoint is for carriers to make available vessel schedules to BCO, LSP, and Solution Platforms, with a commercial purpose; this is out of the boundaries of their vessel schedules alignment with other carriers and terminals for operational purposes for which the Operational Vessel Schedules API is used between carriers, and carriers and terminals.'
      operationId: get-v1-vessel-schedule
      parameters:
      - name: vesselIMONumber
        in: query
        description: The unique reference for a registered Vessel. The reference is the International Maritime Organisation (IMO) number, also sometimes known as the Lloyd&apos;s register code, which does not change during the lifetime of the vessel.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 8
          minLength: 7
          pattern: ^\d{7,8}$
          type: string
          example: '9321483'
      - name: vesselName
        in: query
        description: The name of a vessel. The result will only return schedules including the vessel with the specified name.  Be aware that the vesselName is not unique and might match multiple vessels.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 50
          pattern: ^\S(?:.*\S)?$
          type: string
          example: King of the Seas
      - name: carrierServiceCode
        in: query
        description: The carrier specific service code to filter by. The result will only return schedules including the service code.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 11
          type: string
          example: FE1
      - name: universalServiceReference
        in: query
        description: The Universal Service Reference (USR) as defined by DCSA to filter by.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 8
          minLength: 8
          pattern: ^SR\d{5}[A-Z]$
          type: string
          example: SR12345A
      - name: carrierVoyageNumber
        in: query
        description: The carrier specific identifier of a Voyage - can be both `importVoyageNumber` and `exportVoyageNumber`. The result will only return schedules including the Ports where `carrierVoyageNumber` is either `carrierImportVoyageNumber` or `carrierExportVoyageNumber`.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 50
          type: string
          example: 2103S
      - name: universalVoyageReference
        in: query
        description: The Universal Reference of a Voyage - can be both `importUniversalVoyageReference` and `exportUniversalVoyageReference`. The result will only return schedules including the Ports where `universalVoyageReference` is either `importUniversalVoyageReference` or `exportUniversalVoyageReference`.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 5
          pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
          type: string
          example: 2201N
      - name: UNLocationCode
        in: query
        description: The UN Location Code specifying where a port is located.  Specifying this filter will only return schedules including entire Voyages related to this particular UN Location Code.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 5
          minLength: 5
          pattern: ^[A-Z]{2}[A-Z2-9]{3}$
          type: string
          example: NLAMS
      - name: facilitySMDGCode
        in: query
        description: The facilitySMDGCode specifying a specific facility (using SMDG Code). Be aware that the `facilitySMDGCode` does not contain a `UNLocationCode` - this must be specified in the `UNLocationCode` filter.  Specifying this filter will only return schedules including entire Voyages related to this particular `facilitySMDGCode`.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 6
          type: string
          example: APM
      - name: vesselOperatorCarrierCode
        in: query
        description: The carrier who is in charge of the vessel operation based on either the SMDG or SCAC code lists.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 10
          type: string
          example: MAEU
      - name: startDate
        in: query
        description: 'The start date of the period for which schedule information is requested. If a date of any Timestamp (ATA, ETA or PTA) inside a PortCall matches a date on or after (≥) the `startDate` the entire Voyage (import- and export-Voyage) matching the PortCall will be included in the result. All matching is done towards local Date at the place of the port call.

          If this filter is not provided the default value is `3 months` prior to request time.  The value is populated in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) date format.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date
          example: '2020-04-06'
      - name: endDate
        in: query
        description: "The end date of the period for which schedule information is requested. If a date of any Timestamp (ATA, ETA or PTA) inside a PortCall matches a date on or before (≤) the `endDate` the entire Voyage(import- and export-Voyage) matching the PortCall will be included in the result. All matching is done towards local Date at the place of the port call.  \nIf this filter is not provided the default value is `6 months` after request time.  The value is populated in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) date format.\n"
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date
          example: '2020-04-10'
      - name: limit
        in: query
        description: Specifies the maximum number of `Service Schedule` objects to return.
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          format: int32
          example: 100
          default: 100
      - name: cursor
        in: query
        description: A server generated value to specify a specific point in a collection result, used for pagination.
        required: false
        style: form
        explode: true
        schema:
          maxLength: 1024
          type: string
          example: fE9mZnNldHw9MTAmbGltaXQ9MTA
      - name: API-Version
        in: header
        description: 'An API-Version header **MAY** be added to the request (optional); if added it **MUST** only contain **MAJOR** version. API-Version header **MUST** be aligned with the URI version.

          '
        required: false
        style: simple
        explode: false
        schema:
          type: string
          example: '1'
      responses:
        '200':
          description: OK
          headers:
            API-Version:
              description: 'SemVer used to indicate the version of the contract (API version) returned.

                '
              style: simple
              explode: false
              schema:
                type: string
                example: 1.0.0
            Next-Page-Cursor:
              description: 'The Next-Page-Cursor header contains a cursor value that points to the next page of results in a paginated API response.

                When an initial `GET` endpoint request includes the query parameter `limit=...` the API provider limits the number of items in the root array of the response to the specified limit. If the response would contain more items than the specified limit, the API provider includes only the first set of limit items and appends the following response header:

                `Next-Page-Cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA`, a string that acts as a reference for the next page of results. The cursor value is used in subsequent requests to retrieve the next page by passing it as a query parameter: `?cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA`.


                To retrieve the next page, the API consumer sends a `GET` request to the endpoint URL with only `?cursor=fE9mZnNldHw9MTAmbGltaXQ9MTA` as query parameter. The limit of items per page and any other query parameters may not be altered, therefore it may also not be specified when requesting subsequent pages. The API provider must ignore any query parameters passed along with a cursor, and should return a `400` error if any other query parameter is passed along with the `cursor`.

                '
              style: simple
              explode: false
              schema:
                maxLength: 1024
                type: string
                example: fE9mZnNldHw9MTAmbGltaXQ9MTA
          content:
            application/json:
              schema:
                type: array
                items:
                  title: Service Schedule
                  required:
                  - carrierServiceCode
                  - carrierServiceName
                  - vesselSchedules
                  type: object
                  properties:
                    carrierServiceName:
                      maxLength: 50
                      pattern: ^\S(?:.*\S)?$
                      type: string
                      description: The name of the service.
                      example: Great Lion Service
                    carrierServiceCode:
                      maxLength: 11
                      pattern: ^\S(?:.*\S)?$
                      type: string
                      description: The carrier-specific code of the service for which the schedule details are published.
                      example: FE1
                    universalServiceReference:
                      maxLength: 8
                      minLength: 8
                      pattern: ^SR\d{5}[A-Z]$
                      type: string
                      description: A global unique service reference, as per DCSA standard, agreed by VSA partners for the service.
                      example: SR12345A
                    vesselSchedules:
                      minItems: 1
                      type: array
                      items:
                        title: Vessel Schedule
                        required:
                        - isDummyVessel
                        type: object
                        properties:
                          vessel:
                            title: Vessel
                            type: object
                            properties:
                              vesselIMONumber:
                                maxLength: 8
                                minLength: 7
                                pattern: ^\d{7,8}$
                                type: string
                                description: The unique reference for a registered Vessel. The reference is the International Maritime Organisation (IMO) number, also sometimes known as the Lloyd&apos;s register code, which does not change during the lifetime of the vessel.
                                example: '9321483'
                              MMSINumber:
                                maxLength: 9
                                minLength: 9
                                pattern: ^\d{9}$
                                type: string
                                description: Maritime Mobile Service Identities (MMSIs) are nine-digit numbers used by maritime digital selective calling (DSC), automatic identification systems (AIS) and certain other equipment to uniquely identify a ship or a coast radio station.
                                example: '278111222'
                              name:
                                maxLength: 50
                                pattern: ^\S(?:.*\S)?$
                                type: string
                                description: The name of the Vessel given by the Vessel Operator and registered with IMO.
                                example: King of the Seas
                              flag:
                                maxLength: 2
                                minLength: 2
                                pattern: ^[A-Z]{2}$
                                type: string
                                description: The flag of the nation whose laws the vessel is registered under. This is the [ISO 3166](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en) two-letter country code.
                                example: DE
                              callSign:
                                maxLength: 10
                                pattern: ^\S(?:.*\S)?$
                                type: string
                                description: A unique alphanumeric identity that belongs to the vessel and is assigned by the International Telecommunication Union (ITU). It consists of a three letter alphanumeric prefix that indicates nationality, followed by one to four characters to identify the individual vessel. For instance, vessels registered under Denmark are assigned the prefix ranges 5PA-5QZ, OUAOZZ, and XPA-XPZ. The Call Sign changes whenever a vessel changes its flag.
                                example: NCVV
                              operatorCarrierCode:
                                maxLength: 10
                                type: string
                                description: The carrier who is in charge of the vessel operation based on either the SMDG or SCAC code lists.
                                example: MAEU
                              operatorCarrierCodeListProvider:
                                type: string
                                description: Identifies the code list provider used for the operator and partner carriercodes.
                                example: NMFTA
                                enum:
                                - SMDG
                                - NMFTA
                          isDummyVessel:
                            type: boolean
                            description: This property can be set to `true` when no vessel has been assigned, indicating that the `vesselIMONumber` does not exist.
                          transportCalls:
                            type: array
                            items:
                              title: Transport Call
                              required:
                              - carrierImportVoyageNumber
                              - timestamps
                              - transportCallReference
                              type: object
                              properties:
                                portVisitReference:
                                  maxLength: 50
                                  type: string
                                  description: The unique reference that can be used to link different `transportCallReferences` to the same port visit. The reference is provided by the port to uniquely identify a port call.
                                  example: NLRTM1234589
                                transportCallReference:
                                  maxLength: 100
                                  type: string
                                  description: The unique reference for a transport call. It’s the vessel operator’s responsibility to provide the Transport Call Reference, other parties are obliged to pick it up and use it. It can take the form of Port Call References as defined in OVS Definitions Document, or alternatively a reference as defined by the vessel operator.
                                  example: SR11111X-9321483-2107W-NLRTM-HPD2-1-1
                                carrierImportVoyageNumber:
                                  maxLength: 50
                                  pattern: ^\S(?:.*\S)?$
                                  type: string
                                  description: The identifier of an import voyage. The carrier-specific identifier of the import Voyage.
                                  example: 2103N
                                carrierExportVoyageNumber:
                                  maxLength: 50
                                  pattern: ^\S(?:.*\S)?$
                                  type: string
                                  description: The identifier of an export voyage. The carrier-specific identifier of the export Voyage.
                                  example: 2103S
                                universalImportVoyageReference:
                                  maxLength: 5
                                  minLength: 5
                                  pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
                                  type: string
                                  description: 'A global unique voyage reference for the import Voyage, as per DCSA standard, agreed by VSA partners for the voyage.The voyage reference must match the regular expression pattern: `\d{2}[0-9A-Z]{2}[NEWSR]`


                                    - `2 digits` for the year

                                    - `2 alphanumeric characters` for the sequence number of the voyage

                                    - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est, `S`outh or `R`oundtrip).

                                    '
                                  example: 2103N
                                universalExportVoyageReference:
                                  maxLength: 5
                                  minLength: 5
                                  pattern: ^\d{2}[0-9A-Z]{2}[NEWSR]$
                                  type: string
                                  description: 'A global unique voyage reference for the export Voyage, as per DCSA standard, agreed by VSA partners for the voyage.The voyage reference must match the regular expression pattern: `\d{2}[0-9A-Z]{2}[NEWSR]`


                                    - `2 digits` for the year

                                    - `2 alphanumeric characters` for the sequence number of the voyage

                                    - `1 character` for the direction/haul (`N`orth, `E`ast, `W`est, `S`outh or `R`oundtrip).

                                    '
                                  example: 2103N
                                cutOffTimes:
                                  type: array
                                  description: A list of cut-offs times provided by the carrier when available. A cut-off time indicates the latest date and time by which a task must be completed. For example, the latest date and time by which a container must be delivered to a terminal to be loaded on a vessel, or where certain documentation must be provided by the Shipper.
                                  items:
                                    title: Cut-Off Time
                                    required:
                                    - cutOffDateTime
                                    - cutOffDateTimeCode
                                    type: object
                                    properties:
                                      cutOffDateTimeCode:
                                        maxLength: 3
                                        type: string
                                        description: 'Code for the cut-off time. Possible values are: - `DCO` (Documentation cut-off) - `VCO` (VGM cut-off) - `FCO` (FCL delivery cut-off) - `LCO` (LCL delivery cut-off) **Condition:** only when the `Receipt Type at Origin` is `CFS` - `PCO` (Port cut-off) - `ECP` (Empty container pick-up date and time) - `EFC` (Earliest full-container delivery date) - `RCO` (Reefer cut-off) - `DGC` (Dangerous Goods cut-off) - `OBC` (OOG/BB cut-off) - `TCO` (Transhipment cut-off) - `STA` (Standard booking acceptance) - `SPA` (Special booking acceptance) - `CUA` (Customs Acceptance) - `AFC` (Advanced filling cut-off)

                                          More details can be found on [GitHub](https://github.com/dcsaorg/DCSA-OpenAPI/blob/master/reference-data/CutOffDateTimeCodeList-CS_v1.0.0.csv)

                                          '
                                        example: DCO
                                      cutOffDateTime:
                                        type: string
                                        description: Estimated cut-off time expressed in local time with offset following [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.
                                        format: date-time
                                        example: '2019-11-12T07:41:00-08:30'
                                    description: Cut Off Times.
                                location:
                                  title: TransportCall Location
                                  type: object
                                  properties:
                                    locationName:
                                      maxLength: 100
                                      pattern: ^\S(?:.*\S)?$
                                      type: string
                                      description: An optional name for the location.
                                      example: Port of Amsterdam
                                    address:
                                      title: Address
                                      required:
                                      - city
                                      - countryCode
                                      - street
                                      type: object
                                      properties:
                                        street:
                                          maxLength: 70
                                          type: string
                                          description: The name of the street.
                                          example: Ruijggoordweg
                                        streetNumber:
                                          maxLength: 50
                                          type: string
                                          description: The number of the street.
                                          example: '100'
                                        floor:
                                          maxLength: 50
                                          pattern: ^\S(?:.*\S)?$
                                          type: string
                                          description: The floor of the street number.
                                          example: N/A
                                        postCode:
                                          maxLength: 10
                                          type: string
                                          description: The post code.
                                          example: 1047 HM
                                        city:
                                          maxLength: 35
                                          pattern: ^\S(?:.*\S)?$
                                          type: string
                                          description: The name of the city.
                                          example: Amsterdam
                                        stateRegion:
                                          maxLength: 65
                                          type: string
                                          description: The name of the state/region.
                                          example: North Holland
                                        countryCode:
                                          maxLength: 2
                                          minLength: 2
                                          pattern: ^[A-Z]{2}$
                                          type: string
                                          description: 'The 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en)

                                            '
                                          example: NL
                                      description: An object for storing address related information.
                                    UNLocationCode:
                                      maxLength: 5
                                      minLength: 5
                                      pattern: ^[A-Z]{2}[A-Z2-9]{3}$
                                      type: string
                                      description: 'The UN Location code specifying where the place is located. The pattern used must be

                                        - 2 characters for the country code using [ISO 3166-1 alpha-2](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en) - 3 characters to code a location within that country. Letters A-Z and numbers from 2-9 can be used

                                        More info can be found here: [UN/LOCODE](https://unece.org/trade/cefact/UNLOCODE-Download)

                                        '
                                      example: NLAMS
                                    facilitySMDGCode:
                                      maxLength: 6
                                      type: string
                                      description: 'The code used for identifying the specific facility. This code does not include the UN Location Code.

                                        The codeList used by SMDG is the [SMDG Terminal Code List](https://smdg.org/documents/smdg-code-lists/)'
                                      example: ACT
                                  description: 'General purpose object to capture location-related data, the location can be specified in **any** of the following ways: - `Address` (used to specify the location via an Address) - `UNLocationCode` - `FacilitySMDGCode` (used to specify a location using a `facilitySMDGCode`) It is expected that if a location is specified in multiple ways (both as an `Address` and as a `Facility`) that both ways point to the same location.

                                    '
                                timestamps:
                                  minItems: 1
                                  type: array
                                  items:
                                    title: Timestamp
                                    required:
                                    - eventClassifierCode
                                    - eventDateTime
                                    - eventTypeCode
                                    type: object
                                    properties:
                                      eventTypeCode:
                                        type: string
                                        description: 'Identifier for type of transportEvent.


                                          - `ARRI` (Arrived)

                                          - `DEPA` (Departed)

                                          '
                                        example: ARRI
                                        enum:
                                        - ARRI
                                        - DEPA
                                      eventClassifierCode:
                                        type: string
                                        description: 'Code for the event classifier. Values can vary depending on eventType.


                                          Possible values are:

                                          - `ACT` (Actual)

                                          - `EST` (Estimated)

                                          - `PLN` (Planned)

                                          '
                                        example: PLN
                                        enum:
                                        - PLN
                                        - EST
                                        - ACT
                                      eventDateTime:
                                        type: string
                                        description: The local date and time, when the event takes place, in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format specifying the offset.
                                        format: date-time
                                        example: '2025-01-14T09:21:00+01:00'
        '400':
          description: Bad Request
          headers:
            API-Version:
              description: 'SemVer used to indicate the version of the contract (API version) returned.

                '
              style: simple
              explode: false
              schema:
                type: string
                example: 1.0.0
          content:
            application/json:
              schema:
                title: Error Response
                required:
                - errorDateTime
                - errors
                - httpMethod
                - requestUri
                - statusCode
                - statusCodeText
                type: object
                properties:
                  httpMethod:
                    type: string
                    description: The HTTP method used to make the request e.g. `GET`, `POST`, etc
                    example: POST
                    enum:
                    - GET
                    - HEAD
                    - POST
                    - PUT
                    - DELETE
                    - OPTION
                    - PATCH
                  requestUri:
                    type: string
                    description: The URI that was requested.
                    example: /v1/events
                  statusCode:
                    type: integer
                    description: The HTTP status code returned.
                    format: int32
                    example: 400
                  statusCodeText:
                    maxLength: 50
                    type: string
                    description: A standard short description corresponding to the HTTP status code.
                    example: Bad Request
                  statusCodeMessage:
                    maxLength: 200
                    type: string
                    description: A long description corresponding to the HTTP status code with additional information.
                    example: The supplied data could not be accepted
                  providerCorrelationReference:
                    maxLength: 100
                    type: string
                    description: A unique identifier to the HTTP request within the scope of the API provider.
                    example: 4426d965-0dd8-4005-8c63-dc68b01c4962
                  errorDateTime:
                    type: string
                    description: The DateTime corresponding to the error occurring. Must be formatted using [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.
                    format: date-time
                    example: '2019-11-12T07:41:00Z'
                  errors:
                    minItems: 1
                    type: array
                    description: An array of errors providing more detail about the root cause.
                    items:
                      title: Detailed Error
                      required:
                      - errorCodeMessage
                      - errorCodeText
                      type: object
                      properties:
                        errorCode:
                          maximum: 9999
                          minimum: 7000
                          type: integer
                          description: "The detailed error code returned.\n- `7000-7999` Technical error codes - `8000-8999` Functional error codes - `9000-9999` API provider-specific error codes            \n[Error codes as specified by DCSA](https://developer.dcsa.org/standard-error-codes).\n"
                          format: int32
                          example: 7003
                        property:
                          maxLength: 100
                          type: string
                          description: The name of the property causing the error.
                          example: facilityCode
                        value:
                          maxLength: 500
                          type: string
                          description: The value of the property causing the error serialised as a string exactly as in the original request.
                          example: SG SIN WHS
                        jsonPath:
                          maxLength: 500
                          type: string
                          description: A path to the property causing the error, formatted according to [JSONpath](https://github.com/json-path/JsonPath).
                          example: $.location.facilityCode
                        errorCodeText:
                          maxLength: 100
                          type: string
                          description: A standard short description corresponding to the `errorCode`.
                          example: invalidData
                        errorCodeMessage:
